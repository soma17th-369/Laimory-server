# 로컬 개발용 인프라 (MySQL 8 + Redis 7).
# private-zone의 운영 인프라엔 로컬에서 접속 불가하므로 로컬은 이걸로 테스트한다.
# 사용: docker compose up -d  ->  SPRING_PROFILES_ACTIVE=docker ./gradlew bootRun
services:
  mysql:
    image: mysql:8.0
    container_name: laimory-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laimory
      MYSQL_USER: laimory
      MYSQL_PASSWORD: laimory
      MYSQL_ROOT_PASSWORD: root
    volumes:
      # 스키마와 필수 seed는 docker profile의 Flyway가 앱 시작 시 적용한다.
      - laimory-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: laimory-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laimory-mysql-data:
