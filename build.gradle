plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.laimory'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// AWS SDK v2: S3 presigned PUT 업로드 + 객체 삭제(사진 저장 인프라). S3Presigner도 s3 모듈에 포함.
	implementation platform('software.amazon.awssdk:bom:2.31.6')
	implementation 'software.amazon.awssdk:s3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 멀티스테이지 Docker 빌드에서 실행 가능한 bootJar 하나만 산출되도록 plain jar 비활성화
tasks.named('jar') { enabled = false }

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

// 통합 테스트(실 MySQL/Redis 필요). 로컬: docker compose up -d 후 ./gradlew integrationTest
tasks.register('integrationTest', Test) {
	description = 'Runs @Tag("integration") tests (requires local MySQL/Redis).'
	group = 'verification'
	useJUnitPlatform {
		includeTags 'integration'
	}
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter('test')
}
