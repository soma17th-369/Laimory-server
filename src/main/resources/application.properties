spring.application.name=laimory

# ── Actuator / Micrometer ──
# 애플리케이션 API(8080)와 분리한 관리 포트. 인터넷/일반 WAS SG에는 열지 않고 monitoring SG에서만
# 접근시킨다. endpoint 링크 목록도 끄고 health·Prometheus scrape만 명시적으로 노출한다.
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# 대시보드의 유계 공통 차원. user/task/FID/좌표/URL 같은 요청 값은 metric tag로 사용하지 않는다.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}

# 서버 latency의 Prometheus histogram은 고정 SLO bucket만 생성한다. 전역 percentile histogram은
# cardinality·메모리를 키우므로 활성화하지 않는다.
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s
# 외부 API와 AI callback handler도 같은 원칙으로 고정 bucket만 노출한다.
management.metrics.distribution.slo.http.client.requests=100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.slo.laimory.timeline.callback.duration=25ms,50ms,100ms,250ms,500ms,1s,2s

# PROCESSING TTL(3m) 안에서 이 시간을 넘긴 task를 stuck으로 관측한다(경보 창: 90s 이상 ~ 3m 만료 전).
# 값은 0 초과·3m 미만이어야 하며 위반 시 기동 실패(fail-fast) — live override(TIMELINE_STUCK_AFTER)도 같은 제약.
app.metrics.timeline.stuck-after=${TIMELINE_STUCK_AFTER:90s}
# 배포 workflow가 EC2 .env의 APP_COMMIT_SHA를 배포 SHA로 원자 upsert한다(수동 편집 금지).
# 모든 meter의 공통 tag가 아닌 build info gauge에만 사용한다.
app.build.commit=${APP_COMMIT_SHA:local}

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/laimory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# OSIV off — 커넥션 점유를 요청 전체가 아니라 트랜잭션 구간으로 좁힌다. Spring(HibernateJpaVendorAdapter)이
# hibernate.connection.handling_mode를 DELAYED_ACQUISITION_AND_HOLD로 고정하므로 커넥션은 EntityManager가
# 닫힐 때 반납된다 — OSIV가 켜져 있으면 draft 생성처럼 중간에 DB 일 없는 외부 호출(지오코딩 수백 ms~수 초)이
# 끼는 요청이 그 시간 내내 커넥션을 주차한다. handling_mode를 직접 바꾸지 않는 건 이 설정만으로 같은 결과가
# 나오기 때문이다(측정). 전제: 연관을 plain Long FK와 명시적 join entity로만 표현해 JPA 연관 매핑이 하나도
# 없다 — 트랜잭션 밖 lazy 로딩이 성립하지 않는다. 연관 매핑을 도입한다면 tx 밖 접근을 함께 검토해야 한다.
spring.jpa.open-in-view=false

# stdout JSON 순도 유지(ELK 파싱 전제): show-sql은 Logback을 우회해 System.out에 평문 SQL을 찍으므로
# 기본 프로필에서 금지. SQL 로그가 필요하면 docker 프로필의 org.hibernate.SQL 로거(Logback 경유)를 쓴다.
# 시작 배너도 같은 이유로 끈다(System.out 직행).
spring.main.banner-mode=off

# 에러 메시지 i18n(로캘 = Accept-Language, 헤더 없으면 한국어).
# spring.web.locale: Accept-Language가 없을 때의 기본 로캘. 미설정 시 서버 JVM 로캘(EC2=en)로 새어
# 헤더 없는 요청이 영어 메시지를 받게 되므로 ko로 고정한다(헤더가 있으면 그 값이 우선).
spring.web.locale=ko
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# 번역 누락 시 코드 문자열을 반환한다(핸들러 안에서 NoSuchMessageException이 터져 500으로 뒤집히는 것 방지).
spring.messages.use-code-as-default-message=true

# Redis (외부 관리형/원격 - 배포 기본 프로필). host/password는 env 필수: 미설정 시 기동 실패(fail-fast).
# 로컬 개발은 docker-compose + `docker` 프로필(application-docker.properties)을 사용한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Redis 키 환경 prefix. dev/prod가 단일 Redis EC2를 공유하므로 dev 키에만 dev_를 붙여 격리한다.
# 값은 EC2 .env(REDIS_KEY_PREFIX=dev_)가 소유하고 dev 배포 pre-flight가 exact-one으로 검증한다.
# 미설정(prod·로컬)이면 빈 문자열 → 원본 키 그대로. 모든 Redis 접근은 RedisGateway를 통하며 prefix는 거기서 자동 부착된다.
app.redis.key-prefix=${REDIS_KEY_PREFIX:}

# 자체 인증 토큰. JWT_SECRET은 access token(HS256) 서명키(32바이트 이상 필수 — 기동 시 길이 검증).
# 미설정 시 기동 실패(fail-fast). 배포 전 EC2 .env 반영 필수 — deploy.yml pre-flight가 검사한다.
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.auth.refresh-ttl=${AUTH_REFRESH_TTL:30d}
# 로그인 딥링크 핸드오프용 일회용 app_code 수명. 딥링크 즉시 교환되므로 짧게 고정.
app.auth.app-code-ttl=60s

# ── OAuth2 소셜 로그인(Google·Kakao) — 핸드셰이크는 Spring Security(oauth2Login) 위임 ──
# client IP와 HTTPS request view는 TrustedEdgeRequestFilter가 소유한다. 같은 호스트 nginx의
# 127.0.0.1 socket peer일 때만 단일 Laimory-Client-IP와 X-Forwarded-Proto를 신뢰한다.
# container의 forwarded-header 변환과 X-Forwarded-For chain 해석은 사용하지 않는다.
server.forward-headers-strategy=none

# OAuth 핸드셰이크 세션(state/nonce/PKCE·app_challenge)을 Redis로 외부화 — 이중화 시 시작/콜백이 다른
# 인스턴스에 떨어져도 공유. 네임스페이스는 기존 env prefix로 dev/prod 격리. 수명은 핸드셰이크 왕복만(5분).
spring.session.timeout=5m
spring.session.redis.namespace=${REDIS_KEY_PREFIX:}spring:session

# 클라이언트 등록 — dev/prod 콘솔 클라이언트 분리(값은 EC2 .env). 미설정 시 기동 실패(fail-fast) —
# deploy.yml pre-flight가 구 컨테이너 중지 전에 검사한다. 로컬은 docker 프로필의 더미 기본값으로 기동.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
# profile_nickname은 카카오 콘솔 동의항목 활성화가 선행 조건(미설정 상태로 요청하면 KOE 에러). 닉네임은
# 검증된 id_token의 nickname claim으로 받는다 — UserInfo endpoint 호출 없음(user-info-uri 미설정 유지).
spring.security.oauth2.client.registration.kakao.scope=openid,profile_nickname
# Kakao는 CommonOAuth2Provider에 없어 provider 수동 등록. issuer-uri는 의도적으로 생략 — 설정하면 Boot가
# 기동마다 kauth discovery HTTP를 호출해 불통 시 재기동이 실패한다(오프라인 로컬 테스트도 불가).
# id_token은 서명(jwk-set-uri)+aud+nonce로 검증되고 콜백은 세션의 registrationId에 바인딩되므로 iss 검증 생략을 수용.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json
spring.security.oauth2.client.provider.kakao.user-name-attribute=sub

# draft source 보관기간 cleanup (불변식: retention ≫ PROCESSING_TTL 3m).
# 두 process가 250개 단위 SKIP LOCKED claim으로 나눠 처리하고 PHOTO는 S3 batch delete한다.
app.draft.worker-enabled=${DRAFT_CLEANUP_WORKER_ENABLED:true}
app.draft.retention-days=${DRAFT_RETENTION_DAYS:7}
app.draft.cleanup-cron=${DRAFT_CLEANUP_CRON:0 0 4 * * *}
app.draft.cleanup-zone=${DRAFT_CLEANUP_ZONE:Asia/Seoul}
app.draft.batch-size=${DRAFT_CLEANUP_BATCH_SIZE:250}
app.draft.concurrency=${DRAFT_CLEANUP_CONCURRENCY:1}
app.draft.max-batches-per-run=${DRAFT_CLEANUP_MAX_BATCHES_PER_RUN:4}
app.draft.max-run-duration=${DRAFT_CLEANUP_MAX_RUN_DURATION:60s}

# AI dispatcher 구현 선택: noop(기본 — AI 미연동, prod 안전) | fake(dev — in-process fake가 서버간
# 입력 조회→결과 저장→콜백 흐름을 대행) | http(실 AI 연동 — POST {base-url}/v1/timeline 접수 후 AI가
# 서버간 API로 입력을 조회하고 결과를 저장하며 callback).
# 배포 환경의 APP_AI_MODE로 주입한다. fake 콜백 delay는 app.ai.fake.callback-delay(기본 2s).
app.ai.mode=${APP_AI_MODE:noop}
# 실 AI base URL — http 모드 필수(없으면 기동 실패). 테스트(MockWebServer)가 주입하는 test seam이기도 하다.
app.ai.http.base-url=${APP_AI_HTTP_BASE_URL:}
# AI 접수는 202 즉시 반환 계약이라 타임아웃을 짧게 둔다(초과 = 접수 불명 UNKNOWN — PROCESSING 유지 + POST 502).
# connect+read 합은 PROCESSING TTL(3m)의 절반(90s) 미만이어야 하며 위반 시 기동 실패(fail-fast) —
# task가 dispatch 전에 TTL과 함께 저장되므로, 접수 대기가 수명에 근접하면 만료된 taskId를 202로 반환하게 된다.
app.ai.http.connect-timeout=${APP_AI_HTTP_CONNECT_TIMEOUT:2s}
app.ai.http.read-timeout=${APP_AI_HTTP_READ_TIMEOUT:5s}

# 지오코딩(좌표→도로명주소·건물명·주변 장소) 구현 선택: noop(기본 — 미연동, 항상 빈 결과) | kakao(카카오 로컬 API).
# dev는 EC2 .env(APP_GEO_MODE=kakao)가 켠다(배포 pre-flight가 exact-one 검증). kakao 모드는
# KAKAO_REST_API_KEY(EC2 .env) 필수 — 없으면 기동 실패(fail-fast).
app.geo.mode=${APP_GEO_MODE:noop}
app.geo.kakao-rest-api-key=${KAKAO_REST_API_KEY:}
# 카카오 로컬 API base URL — 운영 endpoint 변경용이 아니라 테스트(MockWebServer)가 주입하는 test seam.
app.geo.kakao-base-url=https://dapi.kakao.com
# 좌표 간 병렬 지오코딩 조회의 요청별 동시 실행 상한(기본 20). 카카오 초당 한도는 존재하되 수치 비공개라
# 무제한 대신 상한을 둔다. 운영 조정은 APP_GEO_LOOKUP_CONCURRENCY(.env 변경만으로는 미반영 — 컨테이너 재기동 필요).
app.geo.lookup-concurrency=${APP_GEO_LOOKUP_CONCURRENCY:20}
# rawId dedupe·기존 저장 item 제외 뒤 실제 lookup할 고유 좌표 상한 — 공개 제품 입력 상한(초과는 외부 호출 전
# 400/-400). 운영 tuning으로 낮추지 않는다(변경은 API 계약 변경).
app.geo.max-unique-coordinates=${APP_GEO_MAX_UNIQUE_COORDINATES:30}

# ── Kakao 전용 HTTP 자원 경계(app.geo.mode=kakao에서만 소비) ──
# 값은 안전 상한을 위한 checked-in 초기 기본값이다(최적 처리량·p95 보장 아님) — dev metric 근거로 조정한다.
# 기동 시 교차 validation(KakaoGeoProperties): 양수·lookupConcurrency<=maxConnections·
# logical deadline >= attempts×(acquire+connect+response)+(attempts-1)×maxBackoff 등 위반 시 기동 실패.
app.geo.http.pool.max-connections=${APP_GEO_HTTP_POOL_MAX_CONNECTIONS:20}
# pool full 시 유계 pending queue. 지연 폭주 방지는 큐 길이가 아니라 acquire timeout이 담당한다(#262) —
# 큐 200 = 동시 하루치 요청(좌표 37개, 요청별 병렬 20) 약 11개 흡수, 최악 drain ~1.2s < timeout 3s.
app.geo.http.pool.pending-acquire-max-count=${APP_GEO_HTTP_POOL_PENDING_ACQUIRE_MAX_COUNT:200}
app.geo.http.pool.pending-acquire-timeout=${APP_GEO_HTTP_POOL_PENDING_ACQUIRE_TIMEOUT:3s}
app.geo.http.connect-timeout=${APP_GEO_HTTP_CONNECT_TIMEOUT:2s}
app.geo.http.response-timeout=${APP_GEO_HTTP_RESPONSE_TIMEOUT:2s}
# retry·backoff·acquire를 모두 포함한 logical call 전체 hard deadline(만료 = 전이 실패, 새 retry 금지).
app.geo.http.logical-call-timeout=${APP_GEO_HTTP_LOGICAL_CALL_TIMEOUT:15s}
app.geo.http.pool.max-idle-time=${APP_GEO_HTTP_POOL_MAX_IDLE_TIME:20s}
app.geo.http.pool.max-life-time=${APP_GEO_HTTP_POOL_MAX_LIFE_TIME:5m}
app.geo.http.pool.eviction-interval=${APP_GEO_HTTP_POOL_EVICTION_INTERVAL:10s}
# 멱등 Kakao GET 한정 제한적 retry(최초 포함 총 시도, 운영 override는 1 또는 2만 허용).
app.geo.retry.max-attempts=${APP_GEO_RETRY_MAX_ATTEMPTS:2}
app.geo.retry.first-backoff=${APP_GEO_RETRY_FIRST_BACKOFF:200ms}
app.geo.retry.max-backoff=${APP_GEO_RETRY_MAX_BACKOFF:500ms}
app.geo.retry.jitter=${APP_GEO_RETRY_JITTER:0.5}
# kakao-local process-wide circuit breaker(count-based window, remote 실패만 계수 — local 압력은 ignore).
app.geo.circuit.sliding-window-size=${APP_GEO_CIRCUIT_SLIDING_WINDOW_SIZE:20}
app.geo.circuit.minimum-number-of-calls=${APP_GEO_CIRCUIT_MINIMUM_NUMBER_OF_CALLS:10}
app.geo.circuit.failure-rate-threshold=${APP_GEO_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
app.geo.circuit.wait-duration-in-open-state=${APP_GEO_CIRCUIT_WAIT_DURATION_IN_OPEN_STATE:30s}
app.geo.circuit.permitted-calls-in-half-open=${APP_GEO_CIRCUIT_PERMITTED_CALLS_IN_HALF_OPEN:3}

# FCM 푸시(AI 타임라인 완료 알림) 구현 선택: noop(기본 — 외부 발송 없음, FID 등록 API/DB는 동작) | firebase(Firebase Admin SDK 발송).
# 배포에서 .env APP_PUSH_MODE=firebase로 켠다. firebase 모드는 ADC 필수 — GOOGLE_APPLICATION_CREDENTIALS에
# 컨테이너 내부 read-only service account JSON "파일 경로"만 둔다(credential 원문을 property로 받지 않음).
# ADC 로드·초기화 실패 시 기동 실패(fail-fast). deploy.yml pre-flight가 구 컨테이너 중지 전에 파일 존재를 검사한다.
app.push.mode=${APP_PUSH_MODE:noop}

# 일일 리마인더 worker. 모든 process가 매분 trigger를 돌리고 MySQL SKIP LOCKED claim으로 서로 다른
# subject occurrence를 나눠 처리한다. 기본 on — 리마인더는 사용자별 기본 OFF라 켜둬도 사용자가 직접
# 설정을 켜기 전에는 발송 대상이 없고, 문제 시 env로 끄는 kill switch만 남긴다(docker 프로필은
# 통합 테스트의 background claim 간섭을 막기 위해 off).
# max-lateness: 예정 시각을 이만큼 넘긴 occurrence는 발송하지 않고 다음 occurrence로 넘긴다 —
# 오래 내려가 있던 서버가 복구되며 새벽에 밀린 알림을 쏟아내는 것을 막는다.
app.push.daily-reminder.worker-enabled=${DAILY_REMINDER_WORKER_ENABLED:true}
app.push.daily-reminder.cron=${DAILY_REMINDER_CRON:0 * * * * *}
app.push.daily-reminder.zone=${DAILY_REMINDER_ZONE:Asia/Seoul}
app.push.daily-reminder.max-lateness=${DAILY_REMINDER_MAX_LATENESS:30m}
app.push.daily-reminder.batch-size=${DAILY_REMINDER_BATCH_SIZE:250}
app.push.daily-reminder.concurrency=${DAILY_REMINDER_CONCURRENCY:1}
app.push.daily-reminder.max-batches-per-run=${DAILY_REMINDER_MAX_BATCHES_PER_RUN:4}
app.push.daily-reminder.max-run-duration=${DAILY_REMINDER_MAX_RUN_DURATION:30s}

# 오토컨피그 HTTP 클라이언트(RestClient.Builder) 타임아웃 — fake AI dispatcher·TestRestTemplate 등 블로킹 호출용.
# 코드에서 requestFactory를 직접 지정하지 않는다(MockRestServiceServer 바인딩과 충돌).
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=2s

# Swagger/OpenAPI 문서(springdoc) 노출 제어. 문서가 API 구조 전체를 드러내므로 기본 off(prod·미설정 안전).
# dev는 EC2 .env(SWAGGER_ENABLED=true)가 켠다(배포 pre-flight가 exact-one 검증). 로컬 개발은 docker 프로필에서 on.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ── 콘텐츠 subject 매핑 HMAC key(#282) ──
# mode: secretsmanager(배포 — 기동 시 Secrets Manager GetSecretValue 1회로 immutable snapshot 로드,
# 실패 시 기동 실패) | fixture(로컬/테스트 전용 — docker 프로필이 기본값 소유). 배포 기본 프로필에는
# 기본값을 두지 않는다(fail-fast) — 배포 환경이 fixture로 조용히 뜨는 것을 막는다.
app.subject.mode=${APP_SUBJECT_MODE}
# secretsmanager 모드 필수 — 대상 secret ARN만 설정으로 주입한다(secret 값은 설정·로그 어디에도 두지 않음).
app.subject.secret-arn=${APP_SUBJECT_SECRET_ARN:}

# 사진 저장 인프라(S3 presigned PUT / CloudFront 비서명 서빙). 빈 기본값이라 미설정으로도 기동된다(실값은 운영 EC2 env).
aws.region=${AWS_REGION:ap-northeast-2}
photo.s3.bucket=${PHOTO_S3_BUCKET:}
photo.cdn.domain=${PHOTO_CDN_DOMAIN:}
# presigned PUT URL 유효시간(java.time.Duration). 기본 10분.
photo.upload.presign-ttl=${PHOTO_UPLOAD_PRESIGN_TTL:10m}
# presign 발급 전 요청 한도(오브젝트 남발·비용 폭주 방지). 크기는 DataSize(예: 15MB).
# - 크기 한도는 whole MB 단위로 설정한다(위반 시 에러 메시지의 {0}이 정수 MB로 잘려 표기됨 — ERROR_1005).
# - 총합 캡은 두지 않는다: 개수x장당(20x5MB=100MB)으로 유계이고, 장당 유효한 정상 선택이 집계에서 거절되는 엣지를 없앴다.
photo.upload.max-count=${PHOTO_UPLOAD_MAX_COUNT:20}
photo.upload.max-size-per-photo=${PHOTO_UPLOAD_MAX_SIZE_PER_PHOTO:5MB}

# finalized PHOTO S3 삭제 작업 worker. 두 process가 MySQL SKIP LOCKED claim으로 서로 다른 job을 처리한다.
# 기본 on이며 즉시 중지가 필요하면 환경변수를 false로 override하고 컨테이너를 새로 생성한다.
# Asia/Seoul 기준 매일 03:00에 process당 bounded worker가 250개 단위로 claim한다.
# 실패·crash job은 available_at에 따라 다음 일일 실행으로 이월한다.
app.timeline.photo-delete.worker-enabled=${TIMELINE_PHOTO_DELETE_WORKER_ENABLED:true}
app.timeline.photo-delete.cron=${TIMELINE_PHOTO_DELETE_CRON:0 0 3 * * *}
app.timeline.photo-delete.zone=${TIMELINE_PHOTO_DELETE_ZONE:Asia/Seoul}
app.timeline.photo-delete.batch-size=${TIMELINE_PHOTO_DELETE_BATCH_SIZE:250}
app.timeline.photo-delete.concurrency=${TIMELINE_PHOTO_DELETE_CONCURRENCY:1}
app.timeline.photo-delete.max-batches-per-run=${TIMELINE_PHOTO_DELETE_MAX_BATCHES_PER_RUN:4}
app.timeline.photo-delete.max-run-duration=${TIMELINE_PHOTO_DELETE_MAX_RUN_DURATION:60s}

# 하루 기록 저장 후 User Memory 갱신. 저장은 이미 커밋됐고 여기는 보조 데이터라 실패해도 사용자 응답에
# 영향이 없다. 저장 커밋 직후에는 대기 큐에 넣기만 하고, AI 접수는 아래 cron이 하루 1회 몰아서 한다 —
# 접수 성공이 반영 성공이 아니라(202 뒤 결과 콜백), 큐를 거치지 않고 보낸 날은 결과가 끝내 오지 않을 때
# 재시도할 근거가 남지 않기 때문이다. 그래서 저장된 하루는 예외 없이 큐를 거치고 반영이 확인될 때만
# 빠진다. 대가는 반영 지연이 최대 cron 주기라는 것이다.
# 배치는 한 사용자의 밀린 날들을 한 요청(최대 5건)으로 묶고, 큐 전체를 읽는다 — 사용자당 접수가 한 건이라
# 건수 상한은 잘려 나간 사용자를 하루 더 기다리게 할 뿐이다.
# retention은 큐에 처음 기록된 시각 기준의 절대 시한이며, 재기록으로 연장되지 않는다(ZADD NX).
# 큐에 있는 항목은 배치가 매일 다시 접수하므로 이 값이 곧 "며칠 동안 재시도하고 포기하는가"다 —
# 실패할 때마다 시한을 갱신하면 영영 안 되는 날이 매일 연장을 받아 큐에서 영구히 안 빠진다.
# draft source retention(7일)보다 길게 두는 이유는 실패 원인이 우리 배포로 풀리는 경우(AI 계약
# 불일치 등)가 있어서다. 그 수정이 나가기 전에 폐기되면 그 날들은 복구되지 않는다.
app.user-memory.update.cron=${USER_MEMORY_UPDATE_CRON:0 30 4 * * *}
app.user-memory.update.zone=${USER_MEMORY_UPDATE_ZONE:Asia/Seoul}
app.user-memory.update.retention=${USER_MEMORY_UPDATE_RETENTION:30d}

# 배치는 결과를 기다리지 않는다 — AI 계약이 "202 접수 → 백그라운드 처리 → 완료 시 결과 API 호출"이라
# 응답을 기다리는 척하려면 폴링을 얹어야 한다. 반영 확인과 큐 정리는 성패를 아는 지점, 즉 결과
# endpoint가 한다(반영되면 큐에서 빼고, AI가 실패를 통보하면 큐에 남아 다음 배치가 재시도).

# 배치는 @Scheduled이고 scheduling pool 기본값이 1이라, 배치의 dispatch(HTTP)가 그 스레드를 점유하면
# 다른 @Scheduled 작업까지 밀린다. 1회 실행 시간이 구별되는 사용자 수 × HTTP 왕복에 비례하므로(dispatch
# 순차), AI read timeout이 유한한 것과 함께 이 값이 나머지 스케줄 작업의 정지를 막는다.
spring.task.scheduling.pool.size=${TASK_SCHEDULING_POOL_SIZE:4}
