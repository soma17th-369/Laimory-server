spring.application.name=laimory

# ── Actuator / Micrometer ──
# 애플리케이션 API(8080)와 분리한 관리 포트. 인터넷/일반 WAS SG에는 열지 않고 monitoring SG에서만
# 접근시킨다. endpoint 링크 목록도 끄고 health·Prometheus scrape만 명시적으로 노출한다.
management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# 대시보드의 유계 공통 차원. user/task/FID/좌표/URL 같은 요청 값은 metric tag로 사용하지 않는다.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:local}

# 서버 latency의 Prometheus histogram은 고정 SLO bucket만 생성한다. 전역 percentile histogram은
# cardinality·메모리를 키우므로 활성화하지 않는다.
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s
# 외부 API와 AI callback handler도 같은 원칙으로 고정 bucket만 노출한다.
management.metrics.distribution.slo.http.client.requests=100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.slo.laimory.timeline.callback.duration=25ms,50ms,100ms,250ms,500ms,1s,2s

# PROCESSING TTL(3m) 안에서 이 시간을 넘긴 task를 stuck으로 관측한다(경보 창: 90s 이상 ~ 3m 만료 전).
# 값은 0 초과·3m 미만이어야 하며 위반 시 기동 실패(fail-fast) — live override(TIMELINE_STUCK_AFTER)도 같은 제약.
app.metrics.timeline.stuck-after=${TIMELINE_STUCK_AFTER:90s}
# 배포 workflow가 이미지 commit을 주입한다. 모든 meter의 공통 tag가 아닌 build info gauge에만 사용한다.
app.build.commit=${APP_COMMIT_SHA:local}

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/laimory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# stdout JSON 순도 유지(ELK 파싱 전제): show-sql은 Logback을 우회해 System.out에 평문 SQL을 찍으므로
# 기본 프로필에서 금지. SQL 로그가 필요하면 docker 프로필의 org.hibernate.SQL 로거(Logback 경유)를 쓴다.
# 시작 배너도 같은 이유로 끈다(System.out 직행).
spring.main.banner-mode=off

# 에러 메시지 i18n(로캘 = Accept-Language, 헤더 없으면 한국어).
# spring.web.locale: Accept-Language가 없을 때의 기본 로캘. 미설정 시 서버 JVM 로캘(EC2=en)로 새어
# 헤더 없는 요청이 영어 메시지를 받게 되므로 ko로 고정한다(헤더가 있으면 그 값이 우선).
spring.web.locale=ko
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# 번역 누락 시 코드 문자열을 반환한다(핸들러 안에서 NoSuchMessageException이 터져 500으로 뒤집히는 것 방지).
spring.messages.use-code-as-default-message=true

# Redis (외부 관리형/원격 - 배포 기본 프로필). host/password는 env 필수: 미설정 시 기동 실패(fail-fast).
# 로컬 개발은 docker-compose + `docker` 프로필(application-docker.properties)을 사용한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Redis 키 환경 prefix. dev/prod가 단일 Redis EC2를 공유하므로 dev 키에만 dev_를 붙여 격리한다.
# 값은 dev 배포(deploy.yml)에서 -e REDIS_KEY_PREFIX=dev_로 주입. 미설정(prod·로컬)이면 빈 문자열 → 원본 키 그대로.
# 모든 Redis 접근은 RedisGateway를 통하며 prefix는 거기서 자동 부착된다.
app.redis.key-prefix=${REDIS_KEY_PREFIX:}

# 자체 인증 토큰. JWT_SECRET은 access token(HS256) 서명키(32바이트 이상 필수 — 기동 시 길이 검증).
# 미설정 시 기동 실패(fail-fast). 배포 전 EC2 .env 반영 필수 — deploy.yml pre-flight가 검사한다.
app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.auth.refresh-ttl=${AUTH_REFRESH_TTL:30d}
# 로그인 딥링크 핸드오프용 일회용 app_code 수명. 딥링크 즉시 교환되므로 짧게 고정.
app.auth.app-code-ttl=60s

# ── OAuth2 소셜 로그인(Google·Kakao) — 핸드셰이크는 Spring Security(oauth2Login) 위임 ──
# client IP와 HTTPS request view는 TrustedEdgeRequestFilter가 소유한다. 같은 호스트 nginx의
# 127.0.0.1 socket peer일 때만 단일 Laimory-Client-IP와 X-Forwarded-Proto를 신뢰한다.
# container의 forwarded-header 변환과 X-Forwarded-For chain 해석은 사용하지 않는다.
server.forward-headers-strategy=none

# OAuth 핸드셰이크 세션(state/nonce/PKCE·app_challenge)을 Redis로 외부화 — 이중화 시 시작/콜백이 다른
# 인스턴스에 떨어져도 공유. 네임스페이스는 기존 env prefix로 dev/prod 격리. 수명은 핸드셰이크 왕복만(5분).
spring.session.timeout=5m
spring.session.redis.namespace=${REDIS_KEY_PREFIX:}spring:session

# 클라이언트 등록 — dev/prod 콘솔 클라이언트 분리(값은 EC2 .env). 미설정 시 기동 실패(fail-fast) —
# deploy.yml pre-flight가 구 컨테이너 중지 전에 검사한다. 로컬은 docker 프로필의 더미 기본값으로 기동.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
# profile_nickname은 카카오 콘솔 동의항목 활성화가 선행 조건(미설정 상태로 요청하면 KOE 에러). 닉네임은
# 검증된 id_token의 nickname claim으로 받는다 — UserInfo endpoint 호출 없음(user-info-uri 미설정 유지).
spring.security.oauth2.client.registration.kakao.scope=openid,profile_nickname
# Kakao는 CommonOAuth2Provider에 없어 provider 수동 등록. issuer-uri는 의도적으로 생략 — 설정하면 Boot가
# 기동마다 kauth discovery HTTP를 호출해 불통 시 재기동이 실패한다(오프라인 로컬 테스트도 불가).
# id_token은 서명(jwk-set-uri)+aud+nonce로 검증되고 콜백은 세션의 registrationId에 바인딩되므로 iss 검증 생략을 수용.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.jwk-set-uri=https://kauth.kakao.com/.well-known/jwks.json
spring.security.oauth2.client.provider.kakao.user-name-attribute=sub

# draft source 보관기간 cleanup (불변식: retention ≫ PROCESSING_TTL 3m). cron 기본 매일 04:00.
app.draft.retention-days=7
app.draft.cleanup-cron=0 0 4 * * *

# AI dispatcher 구현 선택: noop(기본 — AI 미연동, prod 안전) | fake(dev — in-process fake가 AI direct-write 대행)
# | http(실 AI 연동 — POST {base-url}/v1/timeline 접수 후 AI가 final을 직접 write하고 callback).
# 배포 환경의 APP_AI_MODE로 주입한다. fake 콜백 delay는 app.ai.fake.callback-delay(기본 2s).
app.ai.mode=${APP_AI_MODE:noop}
# 실 AI base URL — http 모드 필수(없으면 기동 실패). 테스트(MockWebServer)가 주입하는 test seam이기도 하다.
app.ai.http.base-url=${APP_AI_HTTP_BASE_URL:}
# AI 접수는 202 즉시 반환 계약이라 타임아웃을 짧게 둔다(초과 = 접수 불명 UNKNOWN — PROCESSING 유지 + POST 502).
# connect+read 합은 PROCESSING TTL(3m)의 절반(90s) 미만이어야 하며 위반 시 기동 실패(fail-fast) —
# task가 dispatch 전에 TTL과 함께 저장되므로, 접수 대기가 수명에 근접하면 만료된 taskId를 202로 반환하게 된다.
app.ai.http.connect-timeout=${APP_AI_HTTP_CONNECT_TIMEOUT:2s}
app.ai.http.read-timeout=${APP_AI_HTTP_READ_TIMEOUT:5s}

# 지오코딩(좌표→도로명주소·건물명·주변 장소) 구현 선택: noop(기본 — 미연동, 항상 빈 결과) | kakao(카카오 로컬 API).
# 배포에서 -e APP_GEO_MODE=kakao로 켠다. kakao 모드는 KAKAO_REST_API_KEY(EC2 .env) 필수 — 없으면 기동 실패(fail-fast).
app.geo.mode=${APP_GEO_MODE:noop}
app.geo.kakao-rest-api-key=${KAKAO_REST_API_KEY:}
# 카카오 로컬 API base URL — 운영 endpoint 변경용이 아니라 테스트(MockWebServer)가 주입하는 test seam.
app.geo.kakao-base-url=https://dapi.kakao.com
# 좌표 간 병렬 지오코딩 조회의 동시 실행 상한(기본 20). 카카오 초당 한도는 존재하되 수치 비공개이고 429는
# 영구 실패(strict — enrich 전체 실패)라 무제한 대신 상한을 둔다. 운영 조정은 APP_GEO_LOOKUP_CONCURRENCY
# (=1이 즉시 완화책, .env 변경만으로는 미반영 — 컨테이너 재기동 필요).
app.geo.lookup-concurrency=${APP_GEO_LOOKUP_CONCURRENCY:20}

# FCM 푸시(AI 타임라인 완료 알림) 구현 선택: noop(기본 — 외부 발송 없음, FID 등록 API/DB는 동작) | firebase(Firebase Admin SDK 발송).
# 배포에서 .env APP_PUSH_MODE=firebase로 켠다. firebase 모드는 ADC 필수 — GOOGLE_APPLICATION_CREDENTIALS에
# 컨테이너 내부 read-only service account JSON "파일 경로"만 둔다(credential 원문을 property로 받지 않음).
# ADC 로드·초기화 실패 시 기동 실패(fail-fast). deploy.yml pre-flight가 구 컨테이너 중지 전에 파일 존재를 검사한다.
app.push.mode=${APP_PUSH_MODE:noop}

# 오토컨피그 HTTP 클라이언트(RestClient.Builder) 타임아웃 — fake AI dispatcher·TestRestTemplate 등 블로킹 호출용.
# 코드에서 requestFactory를 직접 지정하지 않는다(MockRestServiceServer 바인딩과 충돌).
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=2s

# 오토컨피그 reactive HTTP 클라이언트(WebClient.Builder) 타임아웃 — 지오코딩(카카오) 외부 호출용.
# 코드에서 ClientHttpConnector를 직접 만들지 않는다 — 이 프로퍼티가 타임아웃의 SSOT.
spring.http.reactiveclient.connect-timeout=2s
spring.http.reactiveclient.read-timeout=2s

# Swagger/OpenAPI 문서(springdoc) 노출 제어. 문서가 API 구조 전체를 드러내므로 기본 off(prod·미설정 안전).
# dev 배포(deploy.yml)에서 -e SWAGGER_ENABLED=true로 켠다. 로컬 개발은 docker 프로필에서 on.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# 사진 저장 인프라(S3 presigned PUT / CloudFront 비서명 서빙). 빈 기본값이라 미설정으로도 기동된다(실값은 운영 EC2 env).
aws.region=${AWS_REGION:ap-northeast-2}
photo.s3.bucket=${PHOTO_S3_BUCKET:}
photo.cdn.domain=${PHOTO_CDN_DOMAIN:}
# presigned PUT URL 유효시간(java.time.Duration). 기본 10분.
photo.upload.presign-ttl=${PHOTO_UPLOAD_PRESIGN_TTL:10m}
# presign 발급 전 요청 한도(오브젝트 남발·비용 폭주 방지). 크기는 DataSize(예: 15MB).
# - 크기 한도는 whole MB 단위로 설정한다(위반 시 에러 메시지의 {0}이 정수 MB로 잘려 표기됨 — ERROR_1005).
# - 총합 캡은 두지 않는다: 개수x장당(20x5MB=100MB)으로 유계이고, 장당 유효한 정상 선택이 집계에서 거절되는 엣지를 없앴다.
photo.upload.max-count=${PHOTO_UPLOAD_MAX_COUNT:20}
photo.upload.max-size-per-photo=${PHOTO_UPLOAD_MAX_SIZE_PER_PHOTO:5MB}

# finalized PHOTO S3 삭제 작업 worker. job 권위는 MySQL이며 현재 환경당 worker-enabled 프로세스는 하나만 둔다.
# 기본 off로 먼저 배포한 뒤 schema/job enqueue를 확인하고 컨테이너를 새로 생성해 활성화한다.
app.timeline.photo-delete.worker-enabled=${TIMELINE_PHOTO_DELETE_WORKER_ENABLED:false}
app.timeline.photo-delete.fixed-delay=${TIMELINE_PHOTO_DELETE_FIXED_DELAY:1m}
app.timeline.photo-delete.batch-size=${TIMELINE_PHOTO_DELETE_BATCH_SIZE:1000}
