spring.application.name=laimory
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/laimory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Redis (외부 관리형/원격 - 배포 기본 프로필). host/password는 env 필수: 미설정 시 기동 실패(fail-fast).
# 로컬 개발은 docker-compose + `docker` 프로필(application-docker.properties)을 사용한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# draft source 보관기간 cleanup (불변식: retention ≫ PROCESSING_TTL 1h). cron 기본 매일 04:00.
app.draft.retention-days=7
app.draft.cleanup-cron=0 0 4 * * *

# 사진 저장 인프라(S3 presigned PUT / CloudFront 비서명 서빙). 빈 기본값이라 미설정으로도 기동된다(실값은 운영 EC2 env).
aws.region=${AWS_REGION:ap-northeast-2}
photo.s3.bucket=${PHOTO_S3_BUCKET:}
photo.cdn.domain=${PHOTO_CDN_DOMAIN:}
# presigned PUT URL 유효시간(java.time.Duration). 기본 10분.
photo.upload.presign-ttl=${PHOTO_UPLOAD_PRESIGN_TTL:10m}
# presign 발급 전 요청 한도(오브젝트 남발·비용 폭주 방지). 크기는 DataSize(예: 15MB).
photo.upload.max-count=${PHOTO_UPLOAD_MAX_COUNT:20}
photo.upload.max-size-per-photo=${PHOTO_UPLOAD_MAX_SIZE_PER_PHOTO:15MB}
photo.upload.max-total-size=${PHOTO_UPLOAD_MAX_TOTAL_SIZE:150MB}
