spring.application.name=laimory
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/laimory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Redis (외부 관리형/원격 - 배포 기본 프로필). host/password는 env 필수: 미설정 시 기동 실패(fail-fast).
# 로컬 개발은 docker-compose + `docker` 프로필(application-docker.properties)을 사용한다.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# AI가 콜백할 절대 URL의 base. v1 디스패처는 no-op이라 로깅용. 실제 AI 연동 시 외부 도달 가능한 주소를 env로 주입.
# 콜백 인증은 task별 one-time Callback-Token(헤더)으로 하며 전역 secret은 두지 않는다.
app.callback.base-url=${APP_CALLBACK_BASE_URL:http://localhost:8080}
