# 기본(폴백) 번들 — Accept-Language가 없거나 매칭 로캘이 없으면 한국어로 응답한다(주 시장).
# key = ErrorCode 코드명. 모든 ErrorCode 상수는 여기와 ko/en에 엔트리가 있어야 한다(ErrorCodeMessagesTest가 강제).
ERROR_0400=잘못된 요청입니다.
ERROR_0404=요청한 리소스를 찾을 수 없습니다.
ERROR_0405=허용되지 않은 메서드입니다.
ERROR_0415=지원하지 않는 미디어 타입입니다.
ERROR_0500=서버 오류가 발생했습니다.
ERROR_1001=요청한 작업을 찾을 수 없습니다.
ERROR_1002=콜백 인증에 실패했습니다.
ERROR_1003=이미 저장된 하루 기록입니다.
