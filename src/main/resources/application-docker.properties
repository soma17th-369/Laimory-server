# 로컬 개발 프로필: docker-compose(mysql:8, redis:7)에 접속한다.
# 실행: docker compose up -d  →  SPRING_PROFILES_ACTIVE=docker ./gradlew bootRun
# (private-zone의 운영 인프라엔 로컬에서 접속 불가하므로 로컬은 이 프로필로 테스트)
spring.datasource.url=jdbc:mysql://localhost:3306/laimory?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=laimory
spring.datasource.password=laimory

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# 로컬 SQL 로그: show-sql(System.out 직행) 대신 Logback 경유 로거로 본다(타임스탬프·tx 패턴 적용됨).
logging.level.org.hibernate.SQL=debug

# 로컬 Swagger UI: http://localhost:8080/swagger-ui/index.html (기본 프로필은 off — prod 비노출)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 로컬/통합테스트 기동용 JWT 시크릿 기본값(32바이트 이상). 실 검증 시엔 env로 덮어쓴다.
app.auth.jwt.secret=${JWT_SECRET:local-dev-only-hs256-secret-key-0123456789abcdef}

# subject 매핑 HMAC(#282): 로컬/통합테스트는 fixture 모드 — 같은 HmacSHA256 구현에 deterministic
# non-production fixture key(base64 32바이트, "laimory-local-fixture-hmac-key!!")를 주입한다.
# 보호 대상 secret이 아니며 이 프로필의 mapping은 배포 환경으로 이관하지 않는다(계획 §2.9).
app.subject.mode=${APP_SUBJECT_MODE:fixture}
app.subject.fixture-key=bGFpbW9yeS1sb2NhbC1maXh0dXJlLWhtYWMta2V5ISE=

# 로컬/통합테스트 기동용 OAuth 더미(컨텍스트 부팅 보장 — registration은 기동 시 네트워크를 안 탐).
# 실제 로그인 왕복 검증 시엔 env로 real 값을 주입하고, dev 콘솔 클라이언트에
# http://localhost:8080/login/oauth2/code/{provider} redirect URI를 등록한다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dummy}
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:local-dummy}

# 일일 리마인더 worker는 로컬/통합테스트에서 끈다 — 매분 background claim이 통합 테스트가 심은
# due 행을 가로채면 claim 개수 단언이 흔들린다(다른 worker들은 새벽 cron이라 테스트 중 안 돈다).
# worker 자체 검증은 claimDue/notifyAll 직접 호출 테스트가 담당하고, 로컬 E2E는 env로 켠다.
app.push.daily-reminder.worker-enabled=${DAILY_REMINDER_WORKER_ENABLED:false}
