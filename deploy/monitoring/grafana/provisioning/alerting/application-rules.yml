apiVersion: 1

groups:
  - orgId: 1
    name: laimory-application
    folder: Laimory
    interval: 1m
    rules:
      - uid: laimory_http_5xx_high
        title: HTTP 5xx ratio high
        dashboardUid: laimory-overview
        panelId: 5
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: '(sum by (environment, instance) (increase(http_server_requests_seconds_count{job="spring_boot",status=~"5..",uri!~"/actuator.*"}[5m])) / clamp_min(sum by (environment, instance) (increase(http_server_requests_seconds_count{job="spring_boot",uri!~"/actuator.*"}[5m])), 1)) and on (environment, instance) (sum by (environment, instance) (increase(http_server_requests_seconds_count{job="spring_boot",uri!~"/actuator.*"}[5m])) >= 20)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'HTTP 5xx ratio is above 5% on {{ $labels.instance }}.'
          description: 'At least 20 requests occurred in five minutes and more than 5% returned 5xx.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#http-errors-or-latency
        labels:
          job: spring_boot
          service: laimory
          severity: critical
        isPaused: false

      - uid: laimory_application_error_log
        title: Application ERROR log detected
        dashboardUid: laimory-logs
        panelId: 3
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: elasticsearch-dev
            model:
              alias: ERROR
              bucketAggs:
                - field: "@timestamp"
                  id: "2"
                  settings:
                    interval: 1m
                    min_doc_count: 0
                  type: date_histogram
              datasource: { type: elasticsearch, uid: elasticsearch-dev }
              intervalMs: 60000
              maxDataPoints: 43200
              metrics:
                - id: "1"
                  type: count
              query: 'service:laimory AND environment:dev AND level:ERROR'
              refId: A
              timeField: "@timestamp"
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: sum
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 'At least one application ERROR log was indexed in the last five minutes.'
          description: 'Open the authenticated Kibana search for details. Raw log content is intentionally excluded from this notification.'
          runbook_url: >-
            https://dev.laimory.app/kibana/app/discover#/?_g=%28filters%3A%21%28%29%2CrefreshInterval%3A%28pause%3A%21t%2Cvalue%3A60000%29%2Ctime%3A%28from%3Anow-15m%2Cto%3Anow%29%29&_a=%28columns%3A%21%28message%2Clevel%2CerrorCode%2Cpath%2CexceptionType%29%2CdataSource%3A%28dataViewId%3A%278e3c574e-45cc-430f-ae74-b91c277b8249%27%2Ctype%3AdataView%29%2Cfilters%3A%21%28%29%2Cinterval%3Aauto%2Cquery%3A%28language%3Akuery%2Cquery%3A%27service%3A%22laimory%22%20and%20environment%3A%22dev%22%20and%20level%3A%22ERROR%22%27%29%2Csort%3A%21%28%21%28%27%40timestamp%27%2Cdesc%29%29%29
        labels:
          environment: dev
          job: application_logs
          service: laimory
          severity: warning
        isPaused: false

      - uid: laimory_http_p95_high
        title: HTTP p95 latency high
        dashboardUid: laimory-overview
        panelId: 6
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: '(histogram_quantile(0.95, sum by (le, environment, instance) (rate(http_server_requests_seconds_bucket{job="spring_boot",uri!~"/actuator.*"}[5m])))) and on (environment, instance) (sum by (environment, instance) (increase(http_server_requests_seconds_count{job="spring_boot",uri!~"/actuator.*"}[5m])) >= 20)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'HTTP server p95 latency is above one second on {{ $labels.instance }}.'
          description: 'The five-minute SLO-bucket estimate is elevated under at least 20 requests.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#http-errors-or-latency
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false

      - uid: laimory_jvm_heap_high
        title: JVM heap pressure
        dashboardUid: laimory-jvm-spring
        panelId: 4
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'sum by (environment, instance) (jvm_memory_used_bytes{job="spring_boot",area="heap"}) / clamp_min(sum by (environment, instance) (jvm_memory_max_bytes{job="spring_boot",area="heap"} > 0), 1)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.85], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: 'JVM heap usage is above 85% on {{ $labels.instance }}.'
          description: 'Heap pressure persisted across normal garbage-collection cycles.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#jvm-or-hikari-pressure
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false

      - uid: laimory_hikari_saturated
        title: Hikari connection pool pressure
        dashboardUid: laimory-jvm-spring
        panelId: 12
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: '(max by (environment, instance) (hikaricp_connections_active{job="spring_boot"}) / clamp_min(max by (environment, instance) (hikaricp_connections_max{job="spring_boot"}), 1)) and on (environment, instance) (max by (environment, instance) (hikaricp_connections_pending{job="spring_boot"}) > 0)'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.9], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: 'Hikari pool usage is above 90% with pending callers on {{ $labels.instance }}.'
          description: 'Database connection acquisition is queued while the application pool is near capacity.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#jvm-or-hikari-pressure
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false
