apiVersion: 1

# Grafana file provisioning owns the complete notification policy tree.
policies:
  - orgId: 1
    receiver: Discord
    group_by:
      - grafana_folder
      - alertname
      - environment
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Discord
        object_matchers:
          - [smoke, "=", "true"]
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 1h
      # firing once and resolved once: a long-lasting alert is not resent while it stays firing.
      # A new firing after resolved is sent again because repeat_interval only covers unchanged firing.
      - receiver: Discord
        object_matchers:
          - [notify_once, "=", "true"]
        repeat_interval: 8760h
