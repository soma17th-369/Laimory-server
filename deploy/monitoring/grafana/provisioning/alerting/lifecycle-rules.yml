apiVersion: 1

groups:
  - orgId: 1
    name: laimory-lifecycle-stuck
    folder: Laimory
    interval: 30s
    rules:
      - uid: laimory_processing_stuck
        title: Timeline task stuck in PROCESSING
        dashboardUid: laimory-overview
        panelId: 18
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'laimory_timeline_task_processing_stuck{job="spring_boot",environment!="test"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.B.Value }} timeline task(s) have remained PROCESSING for at least 90 seconds.'
          description: 'Counts PROCESSING tasks between the 90-second threshold and the three-minute TTL expiry; the gauge read prunes expired members from an atomic Redis processing index.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#timeline-processing-stuck
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false
  - orgId: 1
    name: laimory-credit-stale-charged
    folder: Laimory
    interval: 1m
    rules:
      - uid: laimory_credit_stale_charged
        title: Credit charge left unsettled
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'max by (environment) (laimory_credit_history_charged_stale{job="spring_boot",environment!="test"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.B.Value }} credit charge(s) have stayed CHARGED for over an hour.'
          description: 'A CHARGED credit history older than the threshold means the lost-task refund (Redis expiry notification) was missed. Check the task and refund manually; there is no automatic sweeper.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#credit-charged-stale
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false
  - orgId: 1
    name: laimory-inquiry-unanswered
    folder: Laimory
    interval: 1m
    rules:
      - uid: laimory_inquiry_unanswered_daily
        title: Daily unanswered inquiry check (13:00 KST)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              # hour()/minute() are UTC: 04:00-04:04 UTC = 13:00-13:04 KST (no DST in Korea).
              expr: 'max by (environment) (laimory_inquiry_unanswered{job="spring_boot",environment="prod"}) > 0 and on() hour() == 4 and on() minute() < 5'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.B.Value }} inquiry(ies) are still unanswered.'
          description: 'Daily 13:00 KST check of inquiries without an answered mark, regardless of when they were received. The rule is only true from 13:00 to 13:05 KST, so the resolved message around 13:05 means the check window ended, not that the inquiries were answered.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#inquiry-unanswered
        labels:
          job: spring_boot
          service: laimory
          severity: warning
        isPaused: false
  - orgId: 1
    name: laimory-ai-failure-recent
    folder: Laimory
    interval: 30s
    rules:
      - uid: laimory_ai_failure_recent
        title: Recent timeline AI failures
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'max by (environment) (laimory_credit_history_recent_ai_failed{job="spring_boot",environment="prod"})'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $values.B.Value }} of the last 5 settled timeline creations failed on the AI side.'
          description: 'Counts AI_FAILED, TIMEOUT and DISPATCH_REJECTED refunds among the five most recent settled timeline creations. It resolves once successes bring the count below 3; the notify_once route sends no repeat while it stays firing.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#recent-timeline-ai-failures
        labels:
          job: spring_boot
          service: laimory
          severity: warning
          notify_once: "true"
        isPaused: false
