apiVersion: 1

groups:
  - orgId: 1
    name: laimory-prometheus
    folder: Laimory
    interval: 1m
    rules:
      - uid: laimory_prometheus_reload_failed
        title: Prometheus config reload failed
        dashboardUid: laimory-infrastructure
        panelId: 17
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: 'prometheus_config_last_reload_successful{job="prometheus",environment="dev"}'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: 'Prometheus rejected its most recent configuration reload.'
          description: 'Keep the last known-good configuration active and validate before retrying.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#prometheus-self-health
        labels:
          environment: dev
          instance: monitoring
          job: prometheus
          service: laimory
          severity: critical
        isPaused: false

      - uid: laimory_prometheus_internal_failures
        title: Prometheus rule or TSDB failure
        dashboardUid: laimory-infrastructure
        panelId: 18
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              editorMode: code
              expr: '(sum(increase(prometheus_rule_evaluation_failures_total{job="prometheus",environment="dev"}[5m])) or vector(0)) + (sum(increase(prometheus_tsdb_compactions_failed_total{job="prometheus",environment="dev"}[5m])) or vector(0)) + (sum(increase(prometheus_tsdb_wal_truncations_failed_total{job="prometheus",environment="dev"}[5m])) or vector(0))'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: 'Prometheus reported a rule evaluation, TSDB compaction, or WAL truncation failure.'
          description: 'Inspect Prometheus logs and disk state before restarting or reloading.'
          runbook_url: https://github.com/soma17th-369/Laimory-server/blob/dev/deploy/monitoring/README.md#prometheus-self-health
        labels:
          environment: dev
          instance: monitoring
          job: prometheus
          service: laimory
          severity: critical
        isPaused: false
