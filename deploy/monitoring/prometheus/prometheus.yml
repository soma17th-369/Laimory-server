global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: dev
    stack: laimory

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: blackbox_exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: spring_boot
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/application.yml
        refresh_interval: 1m

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.yml
        refresh_interval: 1m

  - job_name: blackbox_https
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/probe.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
