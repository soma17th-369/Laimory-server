name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash .github/scripts/test-deploy-contract.sh
      - run: deploy/monitoring/tests/test-alert-rule-scripts.sh
      - run: .github/scripts/test-monitoring-deploy-contract.sh
      - name: Test operational assets
        run: |
          python3 deploy/was/tests/test_patch_trusted_edge_nginx.py
          python3 deploy/monitoring/tests/test-render-prometheus-targets.py
          deploy/tests/test-bootstrap-assets.sh
      - name: Start integration test infrastructure
        run: docker compose up -d --wait --wait-timeout 120
      - name: Run build, integration tests, and coverage
        run: ./gradlew build integrationTest jacocoAllTestReport
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
      - name: Upload combined coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/allTests/
          if-no-files-found: error
      - name: Show integration infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop integration test infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
