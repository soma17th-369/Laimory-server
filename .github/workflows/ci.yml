name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # test 태스크가 integration 태그를 제외하므로 MySQL/Redis 없이 단위테스트만 실행된다.
      - run: ./gradlew build
