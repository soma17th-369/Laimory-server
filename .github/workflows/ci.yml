name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: deploy/monitoring/tests/test-alert-rule-scripts.sh
      - run: .github/scripts/test-monitoring-deploy-contract.sh
      # deploy 계약 harness는 지금까지 수동 실행에만 의존했다. 환경 분기가 들어가면서 이 harness가
      # prod 오배포·환경 혼선을 막는 검증을 담당하므로 CI에서 항상 돌린다.
      - run: .github/scripts/test-deploy-contract.sh
      - name: Start integration test infrastructure
        run: docker compose up -d --wait --wait-timeout 120
      - name: Run build, integration tests, and coverage
        run: ./gradlew build integrationTest jacocoAllTestReport
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn
      - name: Upload combined coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/allTests/
          if-no-files-found: error
      - name: Show integration infrastructure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop integration test infrastructure
        if: always()
        run: docker compose down -v --remove-orphans
