name: Deploy to EC2 (SSM)

on:
  push:
    branches: [dev]

permissions:
  id-token: write      # OIDC 필수
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: laimory
  INSTANCE_ID: i-000edb3c849a6bea3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::766037821705:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy via SSM (docker run)
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMG="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          cat > params.json <<EOF
          { "commands": [
            "set -e",
            "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}",
            "docker pull ${IMG}",
            "docker stop laimory 2>/dev/null || true",
            "docker rm laimory 2>/dev/null || true",
            "docker run -d --name laimory --restart always -p 8080:8080 --env-file /home/ubuntu/app/.env ${IMG}",
            "docker image prune -f"
          ] }
          EOF
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for deploy & fetch logs
        run: |
          CMD_ID=${{ steps.ssm.outputs.command_id }}
          sleep 5   # invocation 등록 레이스 방지
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
