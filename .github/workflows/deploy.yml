          # 뒤, 첫 docker stop 직전에만 수행한다 — 그 이전 실패는 기존 .env bytes와 실행 중 SHA를 보존한다.
          # 같은 디렉터리 temp + rename(같은 filesystem이라 원자적)으로 부분 쓰기를 막고 0600·owner를
          # 보존한다. 기존 APP_COMMIT_SHA= 줄은 개수와 무관하게 전부 제거하고 정확히 한 줄만 남긴다
          # (줄 시작의 정확한 KEY=만 대상 — 유사 이름 key는 건드리지 않는다).
          TMP_ENV=\$(mktemp "\$ENV_FILE.XXXXXX")
          awk -v sha="${IMAGE_TAG}" 'index(\$0, "APP_COMMIT_SHA=") == 1 { next } { print } END { print "APP_COMMIT_SHA=" sha }' "\$ENV_FILE" > "\$TMP_ENV"
          chmod 600 "\$TMP_ENV"
          chown --reference="\$ENV_FILE" "\$TMP_ENV"
          mv -f "\$TMP_ENV" "\$ENV_FILE"
          TMP_ENV=""
          docker stop laimory 2>/dev/null || true
          docker rm laimory 2>/dev/null || true
          # 장기 실행 컨테이너의 runtime env source는 --env-file(.env) 하나다 — -e/--env 없음(.env가 SSOT).
          # 환경 고정값(REDIS_KEY_PREFIX·APP_ENV·APP_GEO_MODE·SWAGGER_ENABLED)과 AI/push mode는
          # 위 pre-flight가 exact-one으로 fail-closed 보장한다 — 기대값은 환경별로 주입된다.
          # --log-opt : 앱이 JSON 로그를 stdout으로 뱉으므로 json-file 드라이버 로테이션으로 디스크 폭주 방지.
          # \$PUSH_ARGS : APP_PUSH_MODE=firebase일 때만 credential read-only mount(ADC 경로는 .env가 소유).
          docker run -d --name laimory --restart always --network host --log-opt max-size=10m --log-opt max-file=3 --env-file "\$ENV_FILE" \$PUSH_ARGS ${IMG}
          echo "waiting for /api/v1/intro ..."
          ok=0
          for i in \$(seq 1 45); do if curl -fsS http://localhost:8080/api/v1/intro >/dev/null 2>&1; then ok=1; echo "healthy after \$i tries"; break; fi; sleep 2; done
          if [ "\$ok" != "1" ]; then echo "HEALTH CHECK FAILED"; docker logs --tail 80 laimory 2>&1 || true; exit 1; fi
          EOF
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json
          # host가 여러 대인 환경은 한 대씩 순차 배포한다 — 동시에 보내면 두 대가 같은 순간 컨테이너를
          # 내려 완전 중단이 된다. 각 host의 health gate를 통과한 뒤에만 다음으로 넘어가고, 실패하면
          # 남은 host는 건드리지 않아 최소 한 대는 직전 이미지로 남는다.
          # ⚠️ ALB deregister/register는 이번 범위 밖이다(#337) — 컨테이너를 내린 host는 헬스체크가
          # unhealthy로 판정할 때까지 트래픽을 계속 받아 5xx를 낸다. 무중단이 아니다.
          HOST_INDEX=0
          for IID in ${INSTANCE_IDS//,/ }; do
            HOST_INDEX=$((HOST_INDEX + 1))
            # 로그에는 순번만 쓴다 — instance id는 공개 Actions 로그에 남기지 않는다(위 Resolve 참조).
            HOST_LABEL="host $HOST_INDEX/$HOST_COUNT"
            echo "::group::deploy $ENVIRONMENT $HOST_LABEL"
            CMD_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$IID" \
              --comment "Deploy ${IMAGE_TAG} to $ENVIRONMENT" \
              --parameters file://params.json \
              --query "Command.CommandId" --output text)
            echo "Sent SSM command: $CMD_ID"
            sleep 5   # invocation 등록 레이스 방지
            # `aws ssm wait command-executed`를 쓰지 않는다: 그 waiter는 delay 5 × maxAttempts 20 =
            # 100초가 상한인데, 원격 script는 ECR pull + health gate(최대 90초)만으로 그 근처까지 간다.
            # 상한에 걸리면 배포가 성공하는 중에도 InProgress로 읽혀 실패 처리되고, 루프가 남은 host를
            # 건너뛰어 환경에 서로 다른 image가 남는다. 그래서 종료 상태가 나올 때까지 직접 폴링한다.
            POLL_DEADLINE=$((SECONDS + 900))
            while : ; do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$STATUS" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
              [ "$SECONDS" -lt "$POLL_DEADLINE" ] || { STATUS=WorkflowPollTimeout; break; }
              sleep 5
            done
            echo "----- stdout -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardOutputContent --output text || true
            echo "----- stderr -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" --query StandardErrorContent --output text || true
            echo "Status: $STATUS"
            echo "::endgroup::"
            [ "$STATUS" = "Success" ] \
              || { echo "deploy failed on $HOST_LABEL ($STATUS) - remaining hosts are left untouched" >&2; exit 1; }
          done
