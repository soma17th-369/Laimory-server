name: Deploy to EC2 (SSM)

on:
  push:
    branches: [dev]

permissions:
  id-token: write      # OIDC 필수
  contents: read

# dev 배포 직렬화: 동시 실행 시 옛 SHA가 최신을 덮는 레이스 차단.
# cancel-in-progress=false → 진행 중 배포는 끊지 않고 큐잉(최신이 마지막에 실행되어 승리).
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: laimory
  # 새 Sandbox 계정 값은 repo Variables 로 주입(하드코딩 금지). terraform output 후 설정:
  #   DEV_INSTANCE_ID     = terraform output -json was_instance_ids | jq -r .dev
  #   AWS_DEPLOY_ROLE_ARN = terraform output -raw gha_deploy_role_arn
  INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy via SSM (docker run)
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMG="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # 원격 배포 스크립트: docker run 뒤 /api/v1/intro 헬스체크(최대 90s). 미기동 시 로그 덤프 후 실패.
          # \$ 로 이스케이프한 변수($ok,$i,$(seq))는 러너가 아니라 EC2 호스트에서 평가됨.
          read -r -d '' SCRIPT <<EOF || true
          set -e
          # pre-flight: 앱이 fail-fast로 요구하는 .env 필수 키 검증 — 구 컨테이너를 내리기 전에 실패시켜
          # "새 컨테이너 기동 불가 + 구 컨테이너 이미 중지" 다운타임을 막는다. (JWT_SECRET은 HS256 최소 32자)
          grep -qE '^JWT_SECRET=.{32,}\$' /home/ubuntu/app/.env || { echo "PREFLIGHT FAILED: .env JWT_SECRET missing or shorter than 32 chars"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_ID=.+' /home/ubuntu/app/.env || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_ID missing"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_SECRET=.+' /home/ubuntu/app/.env || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_SECRET missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_ID=.+' /home/ubuntu/app/.env || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_ID missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_SECRET=.+' /home/ubuntu/app/.env || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_SECRET missing"; exit 1; }
          # FCM push pre-flight: .env가 APP_PUSH_MODE=firebase면 host의 service account JSON이 있어야
          # 배포를 진행한다(역시 구 컨테이너 중지 전 검사 — 앱은 ADC 실패 시 fail-fast). noop/미설정이면
          # credential·mount 없이 기동한다. 파일은 SSM runbook으로 수동 배치(terraform/README.md 참고) —
          # credential 원문은 Git/이미지/Terraform/env 값에 두지 않고 read-only 파일 mount로만 전달한다.
          PUSH_ARGS=""
          if grep -qE '^APP_PUSH_MODE=firebase\$' /home/ubuntu/app/.env; then
            { [ -f /home/ubuntu/app/secrets/firebase-service-account.json ] && [ -s /home/ubuntu/app/secrets/firebase-service-account.json ]; } || { echo "PREFLIGHT FAILED: APP_PUSH_MODE=firebase but /home/ubuntu/app/secrets/firebase-service-account.json missing or empty"; exit 1; }
            PUSH_ARGS="-v /home/ubuntu/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro -e GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json"
          fi
          # nginx access log query 제거(멱등 가드) — 이 앱 버전부터 로그인 code(/auth/app?code=, IdP 콜백 ?code=)가
          # 쿼리로 나가므로, 배포보다 먼저 no-query log_format을 보장한다. 새 박스는 user_data가 구성하지만(PR #110),
          # 기존 박스에 runbook이 수동 적용되지 않은 채 배포되는 것을 여기서 구조적으로 막는다(누락 시 자동 보정).
          # \$가 붙은 nginx 변수들은 호스트에서 quoted heredoc('NGINXLOG')으로 쓰이므로 원문 그대로 파일에 들어간다.
          if [ ! -f /etc/nginx/conf.d/log_format_noquery.conf ]; then
            tee /etc/nginx/conf.d/log_format_noquery.conf > /dev/null <<'NGINXLOG'
          log_format noquery '\$remote_addr - \$remote_user [\$time_local] "\$request_method \$uri \$server_protocol" \$status \$body_bytes_sent "\$http_user_agent"';
          NGINXLOG
          fi
          grep -q 'access_log /var/log/nginx/access.log noquery' /etc/nginx/sites-available/laimory || sed -i '/client_max_body_size/a\    access_log /var/log/nginx/access.log noquery;' /etc/nginx/sites-available/laimory
          nginx -t && systemctl reload nginx
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          docker pull ${IMG}
          # firebase 모드면 runtime user 관점의 읽기 가능성까지 구 컨테이너 중지 전에 검증한다 — 앱 컨테이너는
          # Dockerfile의 appuser(UID 1001)로 실행되므로 root의 -f/-s 검사만으로는 소유권/권한 문제(예:
          # ubuntu:0600)를 못 잡는다. 방금 pull한 image를 그대로 사용해 동일 조건(test -r)으로 확인한다.
          if [ -n "\$PUSH_ARGS" ]; then
            docker run --rm -v /home/ubuntu/app/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro --entrypoint /bin/sh ${IMG} -c 'test -r /run/secrets/firebase-service-account.json && test -s /run/secrets/firebase-service-account.json' || { echo "PREFLIGHT FAILED: credential not readable by container runtime user - chown 1001 + chmod 0400 (terraform/README.md FCM runbook)"; exit 1; }
          fi
          docker stop laimory 2>/dev/null || true
          docker rm laimory 2>/dev/null || true
          # REDIS_KEY_PREFIX=dev_ : dev/prod 공유 Redis에서 dev 키 격리. 이 워크플로는 dev 전용이라 여기 고정(누락 불가).
          # APP_ENV=dev : JSON 로그의 environment 필드(ELK index 라우팅용). prod는 자체 배포에서 APP_ENV=prod.
          # APP_AI_MODE=fake : dev 전용 in-process fake AI(dev runtime 시뮬레이터 — 앱에서 draft→콜백 성공 흐름 확인용). prod 워크플로는 미주입 → noop 기본.
          # APP_GEO_MODE=kakao : 지오코딩 enrich 활성화(기본 noop). 키(KAKAO_REST_API_KEY)는 secret이라
          #   YAML에 두지 않고 EC2 .env(--env-file)로 주입 — .env에 키가 없으면 기동이 fail-fast로 실패한다.
          # SWAGGER_ENABLED=true : dev 전용 Swagger UI(/swagger-ui) 노출. prod는 미주입 → 기본 off.
          # -e가 --env-file보다 우선하므로 dev 값이 항상 적용된다(prod는 자체 배포라 미설정 → 기본값).
          # --log-opt : 앱이 JSON 로그를 stdout으로 뱉으므로 json-file 드라이버 로테이션으로 디스크 폭주 방지.
          # \$PUSH_ARGS : APP_PUSH_MODE=firebase일 때만 credential read-only mount + ADC 경로 주입(위 pre-flight).
          docker run -d --name laimory --restart always --network host --log-opt max-size=10m --log-opt max-file=3 --env-file /home/ubuntu/app/.env -e REDIS_KEY_PREFIX=dev_ -e APP_ENV=dev -e APP_GEO_MODE=kakao -e SWAGGER_ENABLED=true \$PUSH_ARGS ${IMG}
          echo "waiting for /api/v1/intro ..."
          ok=0
          for i in \$(seq 1 45); do if curl -fsS http://localhost:8080/api/v1/intro >/dev/null 2>&1; then ok=1; echo "healthy after \$i tries"; break; fi; sleep 2; done
          if [ "\$ok" != "1" ]; then echo "HEALTH CHECK FAILED"; docker logs --tail 80 laimory 2>&1 || true; exit 1; fi
          docker image prune -f
          EOF
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for deploy & fetch logs
        run: |
          CMD_ID=${{ steps.ssm.outputs.command_id }}
          sleep 5   # invocation 등록 레이스 방지
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
