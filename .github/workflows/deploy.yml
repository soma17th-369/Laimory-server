name: Deploy to EC2 (SSM)

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/deploy.yml
      - .dockerignore
      - Dockerfile
      - build.gradle
      - gradle.properties
      - gradle/**
      - gradlew
      - settings.gradle
      - src/main/**
  # deploy-existing(#285): build-only가 기록한 commit SHA + digest image를 build 없이 재배포한다.
  # forward 재기동 전용이며 rollback 절차는 지원하지 않는다. pause gate(DEPLOY_PAUSED)와 무관하게
  # 실행되므로 runbook이 pause 중 cutover 재기동에 사용한다.
  workflow_dispatch:
    inputs:
      image_sha:
        description: "배포할 기존 ECR image의 40자 commit SHA (build 없이 재배포)"
        required: true
        type: string
      image_digest:
        description: "build-only가 기록한 ECR image digest (sha256:64-hex)"
        required: true
        type: string

permissions:
  id-token: write      # OIDC 필수
  contents: read

# dev 배포 직렬화: 동시 실행 시 옛 SHA가 최신을 덮는 레이스 차단.
# cancel-in-progress=false → 진행 중 배포는 끊지 않고 큐잉(최신이 마지막에 실행되어 승리).
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: laimory
  # 확인한 Sandbox 실측값은 repo Variables로 주입한다(하드코딩 금지).
  # 필수 변수: DEV_INSTANCE_ID, AWS_DEPLOY_ROLE_ARN
  INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pause gate(#285): repo variable DEPLOY_PAUSED=true면 push 배포를 workflow 레벨에서 skip한다 —
      # SSM 전송 자체가 없으므로 실행 중 컨테이너와 host .env(APP_COMMIT_SHA)는 그대로다.
      # manual dispatch(deploy-existing)는 pause 중에도 실행된다(runbook cutover 계약).
      - name: Check deploy pause gate
        id: gate
        env:
          DEPLOY_PAUSED: ${{ vars.DEPLOY_PAUSED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DEPLOY_PAUSED" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy paused (repository variable DEPLOY_PAUSED=true) - skipping build and deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy-existing input 형식 검증: SHA/digest가 canonical 형식이 아니면 AWS 접근 전에 실패한다.
      - name: Validate deploy-existing inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "image_sha must be a 40-char lowercase hex commit SHA" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "image_digest must be sha256: followed by 64 lowercase hex chars" >&2; exit 1; }

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: steps.gate.outputs.deploy == 'true' && github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # deploy-existing ECR 선검증: tag가 없거나 build-only가 기록한 digest와 다르면
      # SSM 전송 전에 중단한다. 변경 가능한 tag가 다른 image를 가리키는 경우도 통과시키지 않는다.
      - name: Verify exact image in ECR (deploy-existing)
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          ACTUAL_IMAGE_DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_SHA" --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' --output text) \
            || { echo "image tag $IMAGE_SHA not found in ECR repository $ECR_REPOSITORY" >&2; exit 1; }
          [ "$ACTUAL_IMAGE_DIGEST" = "$EXPECTED_IMAGE_DIGEST" ] \
            || { echo "image digest does not match the build-only result" >&2; exit 1; }
          echo "exact ECR image verified for $IMAGE_SHA"

      - name: Deploy via SSM (docker run)
        if: steps.gate.outputs.deploy == 'true'
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # manual dispatch(deploy-existing)는 checkout SHA가 아니라 input의 기존 image SHA를 배포한다.
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.sha }}
          IMAGE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.image_digest || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IMG="$REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          else
            IMG="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          # 원격 배포 스크립트: docker run 뒤 /api/v1/intro 헬스체크(최대 90s). 미기동 시 로그 덤프 후 실패.
          # \$ 로 이스케이프한 변수($ok,$i,$(seq))는 러너가 아니라 EC2 호스트에서 평가됨.
          # 이 heredoc 본문은 .github/scripts/test-deploy-contract.sh가 그대로 추출·실행해 검증한다.
          read -r -d '' SCRIPT <<EOF || true
          set -e
          # EXIT cleanup: 성공·실패 어느 종료 경로에서도 임시 .env 제거와 미사용 image 정리(prune -af)를
          # 수행한다. 진입 즉시 원래 exit status를 저장해 그대로 반환하므로 prune 실패가 배포 성공을
          # 실패로, 실패를 성공으로 바꾸지 않는다(고정 경고만 남김). 다른 container가 참조하는 image는
          # Docker가 보존하고, 미참조 tagged/dangling image만 삭제된다(rollback은 ECR 재pull).
          TMP_ENV=""
          cleanup() {
            STATUS=\$?
            trap - EXIT
            { [ -n "\$TMP_ENV" ] && rm -f "\$TMP_ENV"; } 2>/dev/null || true
            if ! docker image prune -af >/dev/null 2>&1; then
              echo "WARNING: docker image prune failed (deploy status unchanged)"
            fi
            exit \$STATUS
          }
          trap cleanup EXIT
          # 경로 상수(기본이 운영 경로). LAIMORY_* override는 test-deploy-contract.sh harness가 동일한
          # script 본문을 다른 host에서 실행하기 위한 seam이며 SSM 운영 실행에서는 설정되지 않는다.
          ENV_FILE="\${LAIMORY_ENV_FILE:-/home/ubuntu/app/.env}"
          CRED_FILE="\${LAIMORY_FCM_CRED_FILE:-/home/ubuntu/app/secrets/firebase-service-account.json}"
          # .env 검증 헬퍼(값 비출력): key가 정확히 한 줄 존재하고 기대 줄과 byte 일치해야 한다.
          # 실패 메시지는 key 이름·개수까지만 — 값은 SSM/Actions 로그에 출력하지 않는다(로그 장기 보존).
          require_exact_line() {
            REQ_KEY="\$1"; REQ_LINE="\$2"
            REQ_COUNT=\$(grep -c "^\$REQ_KEY=" "\$ENV_FILE" || true)
            [ "\$REQ_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env \$REQ_KEY must appear exactly once (found \$REQ_COUNT)"; exit 1; }
            grep -qxF "\$REQ_LINE" "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env \$REQ_KEY has unexpected value"; exit 1; }
          }
          # pre-flight 1 — secret presence: 앱이 fail-fast로 요구하는 .env 필수 키 검증 — 구 컨테이너를
          # 내리기 전에 실패시켜 "새 컨테이너 기동 불가 + 구 컨테이너 이미 중지" 다운타임을 막는다.
          # (JWT_SECRET은 HS256 최소 32자)
          grep -qE '^JWT_SECRET=.{32,}\$' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env JWT_SECRET missing or shorter than 32 chars"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_ID=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_ID missing"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_SECRET=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_SECRET missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_ID=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_ID missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_SECRET=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_SECRET missing"; exit 1; }
          # pre-flight 2 — runtime SSOT exact-one 검증: 장기 실행 컨테이너에 -e override가 없으므로 dev
          # 고정값·mode가 .env에 정확히 한 줄씩 없으면 앱이 application default(빈 Redis prefix·local·
          # noop·Swagger off)로 조용히 기동한다. 그 전에 fail-closed한다(중복 key의 --env-file 해석
          # 순서에도 의존하지 않는다).
          require_exact_line REDIS_KEY_PREFIX "REDIS_KEY_PREFIX=dev_"
          require_exact_line APP_ENV "APP_ENV=dev"
          require_exact_line APP_GEO_MODE "APP_GEO_MODE=kakao"
          require_exact_line SWAGGER_ENABLED "SWAGGER_ENABLED=true"
          AI_COUNT=\$(grep -c '^APP_AI_MODE=' "\$ENV_FILE" || true)
          [ "\$AI_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_AI_MODE must appear exactly once (found \$AI_COUNT)"; exit 1; }
          grep -qxE 'APP_AI_MODE=(noop|fake|http)' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_AI_MODE must be one of noop|fake|http"; exit 1; }
          if grep -qxF 'APP_AI_MODE=http' "\$ENV_FILE"; then
            AI_URL_COUNT=\$(grep -c '^APP_AI_HTTP_BASE_URL=' "\$ENV_FILE" || true)
            [ "\$AI_URL_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_AI_HTTP_BASE_URL must appear exactly once when APP_AI_MODE=http (found \$AI_URL_COUNT)"; exit 1; }
            grep -qE '^APP_AI_HTTP_BASE_URL=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_AI_HTTP_BASE_URL must be non-empty when APP_AI_MODE=http"; exit 1; }
          fi
          # spring profile 가드: 배포 컨테이너는 기본 프로필로만 기동해야 한다 — .env에
          # SPRING_PROFILES_ACTIVE가 없는 것이 정상이고, 값에 docker가 끼면 dummy JWT 기본값·
          # localhost DB 등 배포에서 위험한 기본값과 subject fixture-key 기본값까지 켜진다
          # (@Profile 게이팅 없음 — 이 가드와 아래 subject mode 값 고정이 배포의 fixture 금지를
          # 담당한다). 값은 비밀이 아니지만 진단은 key 이름과 고정 문구만 낸다.
          if grep -qE '^SPRING_PROFILES_ACTIVE=.*docker' "\$ENV_FILE"; then
            echo "PREFLIGHT FAILED: .env SPRING_PROFILES_ACTIVE docker profile must not be active"; exit 1;
          fi
          # FCM push pre-flight: APP_PUSH_MODE가 credential mount 여부의 명시적 SSOT다. firebase면 ADC
          # 경로(GOOGLE_APPLICATION_CREDENTIALS, 고정 컨테이너 경로)도 .env가 정확히 한 줄로 소유해야 하고
          # host의 service account JSON이 있어야 배포를 진행한다(역시 구 컨테이너 중지 전 검사 — 앱은 ADC
          # 실패 시 fail-fast). noop이면 credential·mount 없이 기동한다. 파일은 승인된 SSM 절차로 수동
          # 배치한다. credential 원문은 Git/이미지/env 값에 두지 않고
          # read-only 파일 mount로만 전달한다.
          PUSH_COUNT=\$(grep -c '^APP_PUSH_MODE=' "\$ENV_FILE" || true)
          [ "\$PUSH_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_PUSH_MODE must appear exactly once (found \$PUSH_COUNT)"; exit 1; }
          grep -qxE 'APP_PUSH_MODE=(noop|firebase)' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_PUSH_MODE must be one of noop|firebase"; exit 1; }
          PUSH_ARGS=""
          if grep -qxF 'APP_PUSH_MODE=firebase' "\$ENV_FILE"; then
            require_exact_line GOOGLE_APPLICATION_CREDENTIALS "GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json"
            { [ -f "\$CRED_FILE" ] && [ -s "\$CRED_FILE" ]; } || { echo "PREFLIGHT FAILED: APP_PUSH_MODE=firebase but \$CRED_FILE missing or empty"; exit 1; }
            PUSH_ARGS="-v \$CRED_FILE:/run/secrets/firebase-service-account.json:ro"
          fi
          # tracing pre-flight(#277): APP_TRACING_MODE가 OTel agent 활성화의 명시적 SSOT다(앱은 이 키를
          # 소비하지 않는 pre-flight 전용 계약 키). otlp면 JVM 표준 JAVA_TOOL_OPTIONS(-javaagent)와 OTEL_*
          # 세트를 dev 고정값 byte 단위로 검증한다 — agent 2.x 기본 protocol이 http/protobuf라 grpc 누락 시
          # 4317로 http를 쏴 trace가 조용히 유실되고, metrics/logs exporter 기본이 otlp라 none 누락 시 의도
          # 없는 export가 가며, 잘못된 endpoint도 trace를 조용히 유실한다. redaction 목록은 full-override라
          # 부분 목록이면 기본 서명 4종까지 벗겨져 48h trace에 비밀이 남으므로 전체 집합을 값으로 고정한다.
          # sampler만 값 미고정(exact-one non-empty) — 부하 테스트 시 ratio로 일시 전환하는 운영 계약.
          # noop이면 JAVA_TOOL_OPTIONS·OTEL_* 잔존을 금지해 "한 줄 지워져 조용히 꺼진 채 남는" 상태를
          # fail-closed로 막는다.
          TRACING_COUNT=\$(grep -c '^APP_TRACING_MODE=' "\$ENV_FILE" || true)
          [ "\$TRACING_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_TRACING_MODE must appear exactly once (found \$TRACING_COUNT)"; exit 1; }
          grep -qxE 'APP_TRACING_MODE=(noop|otlp)' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_TRACING_MODE must be one of noop|otlp"; exit 1; }
          if grep -qxF 'APP_TRACING_MODE=otlp' "\$ENV_FILE"; then
            require_exact_line JAVA_TOOL_OPTIONS "JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar"
            require_exact_line OTEL_SERVICE_NAME "OTEL_SERVICE_NAME=laimory-dev"
            require_exact_line OTEL_EXPORTER_OTLP_ENDPOINT "OTEL_EXPORTER_OTLP_ENDPOINT=http://10.0.32.14:4317"
            require_exact_line OTEL_EXPORTER_OTLP_PROTOCOL "OTEL_EXPORTER_OTLP_PROTOCOL=grpc"
            require_exact_line OTEL_METRICS_EXPORTER "OTEL_METRICS_EXPORTER=none"
            require_exact_line OTEL_LOGS_EXPORTER "OTEL_LOGS_EXPORTER=none"
            require_exact_line OTEL_INSTRUMENTATION_JDBC_DATASOURCE_ENABLED "OTEL_INSTRUMENTATION_JDBC_DATASOURCE_ENABLED=true"
            require_exact_line OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS "OTEL_INSTRUMENTATION_SANITIZATION_URL_EXPERIMENTAL_SENSITIVE_QUERY_PARAMETERS=AWSAccessKeyId,Signature,sig,X-Goog-Signature,code,state,app_challenge,x,y,query"
            SAMPLER_COUNT=\$(grep -c '^OTEL_TRACES_SAMPLER=' "\$ENV_FILE" || true)
            [ "\$SAMPLER_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env OTEL_TRACES_SAMPLER must appear exactly once when APP_TRACING_MODE=otlp (found \$SAMPLER_COUNT)"; exit 1; }
            grep -qE '^OTEL_TRACES_SAMPLER=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env OTEL_TRACES_SAMPLER must be non-empty when APP_TRACING_MODE=otlp"; exit 1; }
          else
            JTO_COUNT=\$(grep -c '^JAVA_TOOL_OPTIONS=' "\$ENV_FILE" || true)
            [ "\$JTO_COUNT" = "0" ] || { echo "PREFLIGHT FAILED: .env JAVA_TOOL_OPTIONS must not be set when APP_TRACING_MODE=noop"; exit 1; }
            OTEL_COUNT=\$(grep -c '^OTEL_' "\$ENV_FILE" || true)
            [ "\$OTEL_COUNT" = "0" ] || { echo "PREFLIGHT FAILED: .env OTEL_* keys must not be set when APP_TRACING_MODE=noop (found \$OTEL_COUNT)"; exit 1; }
          fi
          # nginx access log query 제거(멱등 가드) — 이 앱 버전부터 로그인 code(/auth/app?code=, IdP 콜백 ?code=)가
          # 쿼리로 나가므로, 배포보다 먼저 no-query log_format을 보장한다. 신규·기존 host 모두
          # 누락된 상태로 배포되지 않도록 여기서 구조적으로 막는다(누락 시 자동 보정).
          # \$가 붙은 nginx 변수들은 호스트에서 quoted heredoc('NGINXLOG')으로 쓰이므로 원문 그대로 파일에 들어간다.
          if [ ! -f /etc/nginx/conf.d/log_format_noquery.conf ]; then
            tee /etc/nginx/conf.d/log_format_noquery.conf > /dev/null <<'NGINXLOG'
          log_format noquery '\$remote_addr - \$remote_user [\$time_local] "\$request_method \$uri \$server_protocol" \$status \$body_bytes_sent "\$http_user_agent"';
          NGINXLOG
          fi
          grep -q 'access_log /var/log/nginx/access.log noquery' /etc/nginx/sites-available/laimory || sed -i '/client_max_body_size/a\    access_log /var/log/nginx/access.log noquery;' /etc/nginx/sites-available/laimory
          # nginx -t 실패는 배포를 중단해야 하므로 &&로 묶지 않는다(set -e의 &&-리스트 예외 회피 — fail-closed).
          nginx -t
          systemctl reload nginx
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          docker pull ${IMG}
          # firebase 모드면 runtime user 관점의 읽기 가능성까지 구 컨테이너 중지 전에 검증한다 — 앱 컨테이너는
          # Dockerfile의 appuser(UID 1001)로 실행되므로 root의 -f/-s 검사만으로는 소유권/권한 문제(예:
          # ubuntu:0600)를 못 잡는다. 방금 pull한 image를 그대로 사용해 동일 조건(test -r)으로 확인한다.
          # (일회성 docker run --rm은 장기 실행 컨테이너가 아니므로 -e 금지 대상이 아니다.)
          if [ -n "\$PUSH_ARGS" ]; then
            docker run --rm -v "\$CRED_FILE":/run/secrets/firebase-service-account.json:ro --entrypoint /bin/sh ${IMG} -c 'test -r /run/secrets/firebase-service-account.json && test -s /run/secrets/firebase-service-account.json' || { echo "PREFLIGHT FAILED: credential not readable by container runtime user - chown 1001 + chmod 0400"; exit 1; }
          fi
          # subject mapping pre-flight(#282): 배포 환경은 subject HMAC key를 Secrets Manager에서만 받는다.
          # APP_SUBJECT_MODE가 secretsmanager 외 값(fixture 등)이면 테스트 고정 key로 가명화되는 조용한
          # 사고가 되므로 mode를 값까지 고정하고, ARN 형식·runtime secret read 권한·mapping schema까지
          # 전부 구 컨테이너 중지 전에 검사한다(ddl-auto=validate라 schema 불일치 시 새 앱이 기동 실패 —
          # "새 컨테이너 기동 불가 + 구 컨테이너 이미 중지" 다운타임을 막는다). 실패 진단은 key 이름·개수
          # 까지만 — 값(ARN·DB 접속 정보·secret)은 SSM/Actions 로그에 출력하지 않는다.
          SUBJECT_MODE_COUNT=\$(grep -c '^APP_SUBJECT_MODE=' "\$ENV_FILE" || true)
          [ "\$SUBJECT_MODE_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_SUBJECT_MODE must appear exactly once (found \$SUBJECT_MODE_COUNT)"; exit 1; }
          grep -qxF 'APP_SUBJECT_MODE=secretsmanager' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_SUBJECT_MODE must be secretsmanager"; exit 1; }
          ARN_COUNT=\$(grep -c '^APP_SUBJECT_SECRET_ARN=' "\$ENV_FILE" || true)
          [ "\$ARN_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_SUBJECT_SECRET_ARN must appear exactly once (found \$ARN_COUNT)"; exit 1; }
          grep -qE '^APP_SUBJECT_SECRET_ARN=arn:aws:secretsmanager:' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_SUBJECT_SECRET_ARN must start with arn:aws:secretsmanager:"; exit 1; }
          # 앱 region은 미설정(default ap-northeast-2) 또는 같은 값 한 줄만 허용한다. 컨테이너는 --env-file만
          # 받으므로 AWS credential/profile/endpoint override가 한 줄이라도 있으면 runtime role과 다른 identity로
          # 뜰 수 있어 금지한다. host CLI도 env/shared config를 제거한 subshell에서 IMDS instance profile만 쓴다.
          SUBJECT_REGION_COUNT=\$(grep -c '^AWS_REGION=' "\$ENV_FILE" || true)
          [ "\$SUBJECT_REGION_COUNT" -le 1 ] || { echo "PREFLIGHT FAILED: .env AWS_REGION must appear at most once (found \$SUBJECT_REGION_COUNT)"; exit 1; }
          if [ "\$SUBJECT_REGION_COUNT" = "1" ]; then
            grep -qxF 'AWS_REGION=${AWS_REGION}' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env AWS_REGION must match deployment region"; exit 1; }
          fi
          AWS_OVERRIDE_COUNT=\$(grep -cE '^(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|AWS_PROFILE|AWS_DEFAULT_PROFILE|AWS_SHARED_CREDENTIALS_FILE|AWS_CONFIG_FILE|AWS_WEB_IDENTITY_TOKEN_FILE|AWS_ROLE_ARN|AWS_ROLE_SESSION_NAME|AWS_CONTAINER_CREDENTIALS_RELATIVE_URI|AWS_CONTAINER_CREDENTIALS_FULL_URI|AWS_EC2_METADATA_DISABLED|AWS_EC2_METADATA_SERVICE_ENDPOINT|AWS_ENDPOINT_URL|AWS_ENDPOINT_URL_SECRETS_MANAGER)=' "\$ENV_FILE" || true)
          [ "\$AWS_OVERRIDE_COUNT" = "0" ] || { echo "PREFLIGHT FAILED: .env AWS credential/profile/endpoint overrides are forbidden (found \$AWS_OVERRIDE_COUNT)"; exit 1; }
          # runtime secret read + 내용 계약 검증: host instance profile로 GetSecretValue를 1회 수행해
          # SecretString을 shell 변수로만 받고(출력·echo·argv 어디에도 싣지 않음), 앱
          # SecretsManagerSubjectHmacKeyConfig.parse()와 1:1 규칙을 python3에 환경변수로만 넘겨
          # 검증한다 — JSON object · currentVersion 정수 1~32767 · currentKey base64 정확히 32바이트 ·
          # previousVersion/previousKey 동반 존재·version 상이·key 상이·previousKey도 32바이트 ·
          # SecretString 부재(SecretBinary 전용)면 실패. 이 계약을 어긴 secret은 새 앱이 기동 실패
          # (자동 rollback 없음)하므로 구 컨테이너 중지 전에 잡는다. 실패 진단은 항목 이름만 내고
          # python stderr도 버린다 — secret 값은 어떤 경로로도 로그에 닿지 않는다.
          command -v python3 >/dev/null 2>&1 || { echo "PREFLIGHT FAILED: python3 not found on host (required for subject secret validation)"; exit 1; }
          SUBJECT_SECRET_ARN=\$(grep '^APP_SUBJECT_SECRET_ARN=' "\$ENV_FILE" | cut -d= -f2-)
          SUBJECT_SECRET_PAYLOAD=\$( unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_EC2_METADATA_DISABLED AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_ENDPOINT_URL AWS_ENDPOINT_URL_SECRETS_MANAGER; AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws secretsmanager get-secret-value --secret-id "\$SUBJECT_SECRET_ARN" --region ${AWS_REGION} --query SecretString --output json 2>/dev/null ) || { echo "PREFLIGHT FAILED: subject secret read failed (runtime role GetSecretValue or ARN)"; exit 1; }
          SUBJECT_SECRET_DIAG=\$(SUBJECT_SECRET_PAYLOAD="\$SUBJECT_SECRET_PAYLOAD" python3 -c '
          import base64, json, os, sys
          def die(msg):
              print(msg)
              sys.exit(1)
          payload = json.loads(os.environ["SUBJECT_SECRET_PAYLOAD"])
          if payload is None:
              die("SecretString missing (SecretBinary-only secret is not supported)")
          try:
              root = json.loads(payload)
          except Exception:
              die("is not valid JSON")
          if not isinstance(root, dict):
              die("must be a JSON object")
          def ver(field):
              value = root.get(field)
              if isinstance(value, bool) or not isinstance(value, int):
                  die(field + " must be an integer")
              if value <= 0 or value > 32767:
                  die(field + " must be a positive SMALLINT")
              return value
          def key(field):
              value = root.get(field)
              if not isinstance(value, str):
                  die(field + " must be a string")
              try:
                  decoded = base64.b64decode(value, validate=True)
              except Exception:
                  die(field + " must be valid base64")
              if len(decoded) != 32:
                  die(field + " must decode to exactly 32 bytes")
              return decoded
          current_version = ver("currentVersion")
          current_key = key("currentKey")
          if (root.get("previousVersion") is None) != (root.get("previousKey") is None):
              die("previousVersion and previousKey must be present together")
          if root.get("previousVersion") is not None:
              if ver("previousVersion") == current_version:
                  die("previousVersion must differ from currentVersion")
              if key("previousKey") == current_key:
                  die("currentKey and previousKey must differ")
          ' 2>/dev/null) || { echo "PREFLIGHT FAILED: subject secret \${SUBJECT_SECRET_DIAG:-validation could not run}"; exit 1; }
          SUBJECT_SECRET_PAYLOAD=""
          # mapping schema: 앱 datasource와 같은 DB_HOST:3306/laimory를 검사한다. 앱이 소비하는 DB_* 3개를
          # exact-one non-empty로 먼저 확인한 뒤(값 비출력), 고정 태그 mysql:8.0 client로 column 수·정확한
          # type/nullability·단일-column PK/UNIQUE를 모두 판정한다. 추가 raw user_id나 composite index도
          # 실패한다. password는 docker 인자에 값을 싣지 않도록 -e MYSQL_PWD 환경 전달만 쓴다.
          for DB_KEY in DB_HOST DB_USERNAME DB_PASSWORD; do
            DB_KEY_COUNT=\$(grep -c "^\$DB_KEY=" "\$ENV_FILE" || true)
            [ "\$DB_KEY_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env \$DB_KEY must appear exactly once (found \$DB_KEY_COUNT)"; exit 1; }
            grep -qE "^\$DB_KEY=.+" "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env \$DB_KEY must be non-empty"; exit 1; }
          done
          DB_HOST_VAL=\$(grep '^DB_HOST=' "\$ENV_FILE" | cut -d= -f2-)
          DB_USER_VAL=\$(grep '^DB_USERNAME=' "\$ENV_FILE" | cut -d= -f2-)
          DB_PASS_VAL=\$(grep '^DB_PASSWORD=' "\$ENV_FILE" | cut -d= -f2-)
          SUBJECT_SCHEMA_SQL="SELECT CASE WHEN (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links') = 3 AND (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND ((COLUMN_NAME = 'user_lookup_key' AND COLUMN_TYPE = 'binary(32)' AND IS_NULLABLE = 'NO') OR (COLUMN_NAME = 'subject_id' AND COLUMN_TYPE = 'binary(16)' AND IS_NULLABLE = 'NO') OR (COLUMN_NAME = 'lookup_key_version' AND COLUMN_TYPE = 'smallint' AND IS_NULLABLE = 'NO'))) = 3 AND (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND INDEX_NAME = 'PRIMARY') = 1 AND (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND INDEX_NAME = 'PRIMARY' AND NON_UNIQUE = 0 AND COLUMN_NAME = 'user_lookup_key' AND SEQ_IN_INDEX = 1 AND SUB_PART IS NULL) = 1 AND EXISTS (SELECT 1 FROM (SELECT INDEX_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND NON_UNIQUE = 0 AND INDEX_NAME <> 'PRIMARY' GROUP BY INDEX_NAME HAVING COUNT(*) = 1 AND MAX(COLUMN_NAME = 'subject_id' AND SEQ_IN_INDEX = 1 AND SUB_PART IS NULL) = 1) subject_unique) THEN 1 ELSE 0 END"
          SCHEMA_MATCH=\$(MYSQL_PWD="\$DB_PASS_VAL" docker run --rm --network host -e MYSQL_PWD mysql:8.0 mysql -h"\$DB_HOST_VAL" -P3306 -u"\$DB_USER_VAL" -N -B -e "\$SUBJECT_SCHEMA_SQL" laimory 2>/dev/null) || { echo "PREFLIGHT FAILED: subject mapping schema query failed"; exit 1; }
          [ "\$SCHEMA_MATCH" = "1" ] || { echo "PREFLIGHT FAILED: user_subject_links schema mismatch"; exit 1; }
          # APP_COMMIT_SHA 원자 upsert(commit point): 모든 pre-stop 검사·ECR login·pull·UID 검사가 성공한
          # 뒤, 첫 docker stop 직전에만 수행한다 — 그 이전 실패는 기존 .env bytes와 실행 중 SHA를 보존한다.
          # 같은 디렉터리 temp + rename(같은 filesystem이라 원자적)으로 부분 쓰기를 막고 0600·owner를
          # 보존한다. 기존 APP_COMMIT_SHA= 줄은 개수와 무관하게 전부 제거하고 정확히 한 줄만 남긴다
          # (줄 시작의 정확한 KEY=만 대상 — 유사 이름 key는 건드리지 않는다).
          TMP_ENV=\$(mktemp "\$ENV_FILE.XXXXXX")
          awk -v sha="${IMAGE_TAG}" 'index(\$0, "APP_COMMIT_SHA=") == 1 { next } { print } END { print "APP_COMMIT_SHA=" sha }' "\$ENV_FILE" > "\$TMP_ENV"
          chmod 600 "\$TMP_ENV"
          chown --reference="\$ENV_FILE" "\$TMP_ENV"
          mv -f "\$TMP_ENV" "\$ENV_FILE"
          TMP_ENV=""
          docker stop laimory 2>/dev/null || true
          docker rm laimory 2>/dev/null || true
          # 장기 실행 컨테이너의 runtime env source는 --env-file(.env) 하나다 — -e/--env 없음(.env가 SSOT).
          # dev 고정값(REDIS_KEY_PREFIX=dev_·APP_ENV=dev·APP_GEO_MODE=kakao·SWAGGER_ENABLED=true)과
          # AI/push mode는 위 pre-flight가 exact-one으로 fail-closed 보장한다. prod는 자체 배포에서 자기
          # .env로 같은 계약을 따른다(신규 host 준비와 값 전환은 별도 승인된 운영 절차).
          # --log-opt : 앱이 JSON 로그를 stdout으로 뱉으므로 json-file 드라이버 로테이션으로 디스크 폭주 방지.
          # \$PUSH_ARGS : APP_PUSH_MODE=firebase일 때만 credential read-only mount(ADC 경로는 .env가 소유).
          docker run -d --name laimory --restart always --network host --log-opt max-size=10m --log-opt max-file=3 --env-file "\$ENV_FILE" \$PUSH_ARGS ${IMG}
          echo "waiting for /api/v1/intro ..."
          ok=0
          for i in \$(seq 1 45); do if curl -fsS http://localhost:8080/api/v1/intro >/dev/null 2>&1; then ok=1; echo "healthy after \$i tries"; break; fi; sleep 2; done
          if [ "\$ok" != "1" ]; then echo "HEALTH CHECK FAILED"; docker logs --tail 80 laimory 2>&1 || true; exit 1; fi
          EOF
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for deploy & fetch logs
        if: steps.gate.outputs.deploy == 'true'
        run: |
          CMD_ID=${{ steps.ssm.outputs.command_id }}
          sleep 5   # invocation 등록 레이스 방지
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
