name: Deploy to EC2 (SSM)

on:
  push:
    # dev push -> dev 환경, main push -> prod 환경, test push -> test 환경(#400).
    # 매핑은 Resolve deploy environment 한 곳이 소유한다.
    branches: [dev, main, test]
    paths:
      - .github/workflows/deploy.yml
      - .dockerignore
      - Dockerfile
      - build.gradle
      - gradle.properties
      - gradle/**
      - gradlew
      - settings.gradle
      - src/main/**
  # deploy-existing: build-only가 기록한 commit SHA + digest image를 build 없이 재배포한다.
  # 자동 rollback은 아니며, pause gate(DEPLOY_PAUSED)와 무관하게 운영자가 승인한 exact image를 기동한다.
  workflow_dispatch:
    inputs:
      # push는 브랜치로 환경이 정해지지만 수동 실행은 정할 근거가 없어 명시 입력을 받는다.
      # 잘못 고르면 그대로 나가므로 기본값을 두지 않는다(선택을 강제).
      environment:
        description: "배포 대상 환경"
        required: true
        type: choice
        options: [dev, prod, test]
      image_sha:
        description: "배포할 기존 ECR image의 40자 commit SHA (build 없이 재배포)"
        required: true
        type: string
      image_digest:
        description: "build-only가 기록한 ECR image digest (sha256:64-hex)"
        required: true
        type: string

permissions:
  id-token: write      # OIDC 필수
  contents: read

# 환경별 배포 직렬화: 동시 실행 시 옛 SHA가 최신을 덮는 레이스 차단.
# cancel-in-progress=false → 진행 중 배포는 끊지 않고 큐잉(최신이 마지막에 실행되어 승리).
# group은 step 출력을 못 읽으므로 아래 Resolve 단계와 같은 매핑을 식으로 다시 쓴다 —
# 두 곳이 갈리면 서로 다른 환경이 같은 group을 쓰거나 같은 환경이 두 group으로 갈리므로 함께 고친다.
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || (github.ref_name == 'test' && 'test' || 'dev')) }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: laimory
  # 확인한 Sandbox 실측값은 repo 설정으로 주입한다(하드코딩 금지).
  # 필수 Secrets: DEV_INSTANCE_ID, PROD_INSTANCE_IDS, TEST_INSTANCE_ID — Actions는 step의 env: 블록을
  #   로그에 그대로 echo하는데 repository Variable은 마스킹되지 않고 이 저장소는 PUBLIC이라 instance id가
  #   공개 워크플로 로그에 남는다. Secret은 Actions가 ***로 마스킹한다.
  # 필수 Variables: AWS_DEPLOY_ROLE_ARN, AWS_TEST_DEPLOY_ROLE_ARN, DEPLOY_PAUSED
  #   (비밀이 아니고 로그에 보여야 진단이 된다)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 환경 결정의 단일 지점. 이후 어떤 step도 브랜치·이벤트를 다시 보고 환경을 판단하지 않고
      # 이 step의 출력만 읽는다 — 배포 role이 dev/prod 인스턴스를 모두 허용하게 된 뒤로는
      # 이 분기가 prod 오배포를 막는 유일한 방어선이라, 판단이 여러 곳에 흩어지면 안 된다.
      # 알 수 없는 환경·빈 인스턴스 목록은 AWS 접근 전에 fail-closed한다.
      - name: Resolve deploy environment
        id: env
        env:
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
          # instance 목록만 Secrets에서 읽는다 — Actions가 이 env: 블록을 공개 로그에 그대로 echo하므로
          # Variable로 두면 매 실행마다 instance id가 남는다(Secret은 ***로 마스킹된다).
          DEV_INSTANCE_ID: ${{ secrets.DEV_INSTANCE_ID }}
          PROD_INSTANCE_IDS: ${{ secrets.PROD_INSTANCE_IDS }}
          TEST_INSTANCE_ID: ${{ secrets.TEST_INSTANCE_ID }}
          # 배포 role은 환경별로 갈린다(#400) — test role의 OIDC trust는 refs/heads/test뿐이라
          # 기존 단일 role을 계속 쓰면 test push가 자격증명 단계에서 실패한다. role ARN은 비밀이
          # 아니고 로그에 보여야 진단이 되므로 Variable로 둔다(기존 AWS_DEPLOY_ROLE_ARN과 같은 원칙).
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_TEST_DEPLOY_ROLE_ARN: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ENVIRONMENT="$DISPATCH_ENVIRONMENT"
            # test role의 OIDC trust가 refs/heads/test 하나뿐이라, 다른 ref에서 environment=test를
            # 고르면 AssumeRoleWithWebIdentity가 sub 불일치로 실패한다. 그 불투명한 에러 대신
            # 자격증명 접근 전에 원인을 말하고 fail-closed한다. dev/prod의 cross-ref dispatch
            # ("main에서 dev를 고를 수도")는 기존 계약 그대로 둔다.
            if [ "$ENVIRONMENT" = "test" ] && [ "$GITHUB_REF_NAME" != "test" ]; then
              echo "environment=test must be dispatched from the test branch ref (current: $GITHUB_REF_NAME) - the test deploy role trusts refs/heads/test only" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            ENVIRONMENT=prod
          elif [ "$GITHUB_REF_NAME" = "test" ]; then
            ENVIRONMENT=test
          else
            ENVIRONMENT=dev
          fi
          # 환경 고정값은 앱의 application default가 아니라 각 host .env가 소유하며, 원격 pre-flight가
          # 이 기대값과 byte 일치를 요구한다(exact-one). 여기 값이 곧 그 계약이다.
          # EXPECT_HOST_COUNT는 "이 환경은 몇 대인가"의 계약이다. 비어 있지 않은지만 보면 변수에서
          # 한 대가 빠졌을 때 나머지 host가 옛 image를 계속 서빙하는데도 workflow가 성공으로 끝난다.
          # host를 늘리거나 줄이면 instance 목록 repository secret과 이 값을 함께 고친다.
          case "$ENVIRONMENT" in
            dev)
              INSTANCE_IDS="$DEV_INSTANCE_ID"
              ROLE_ARN="$AWS_DEPLOY_ROLE_ARN"
              EXPECT_HOST_COUNT=1
              EXPECT_APP_ENV=dev
              EXPECT_REDIS_KEY_PREFIX=dev_
              EXPECT_SWAGGER_ENABLED=true
              EXPECT_APP_GEO_MODE=kakao
              ;;
            prod)
              INSTANCE_IDS="$PROD_INSTANCE_IDS"
              ROLE_ARN="$AWS_DEPLOY_ROLE_ARN"
              EXPECT_HOST_COUNT=2
              EXPECT_APP_ENV=prod
              EXPECT_REDIS_KEY_PREFIX=      # prod는 빈 prefix(dev만 dev_로 Redis 키를 격리)
              EXPECT_SWAGGER_ENABLED=false
              EXPECT_APP_GEO_MODE=kakao
              ;;
            test)
              INSTANCE_IDS="$TEST_INSTANCE_ID"
              ROLE_ARN="$AWS_TEST_DEPLOY_ROLE_ARN"
              EXPECT_HOST_COUNT=1
              EXPECT_APP_ENV=test
              EXPECT_REDIS_KEY_PREFIX=test_
              EXPECT_SWAGGER_ENABLED=true
              EXPECT_APP_GEO_MODE=kakao
              ;;
            *)
              echo "unknown deploy environment: '$ENVIRONMENT' (expected dev, prod or test)" >&2; exit 1 ;;
          esac
          [ -n "$INSTANCE_IDS" ] \
            || { echo "no instance ids configured for environment $ENVIRONMENT (check repository secrets)" >&2; exit 1; }
          [ -n "$ROLE_ARN" ] \
            || { echo "no deploy role arn configured for environment $ENVIRONMENT (check repository variables)" >&2; exit 1; }
          # 공백·콤마 어느 쪽으로 적혀 있어도 같은 개수로 센다(배포 루프와 같은 정규화).
          set -- ${INSTANCE_IDS//,/ }
          [ "$#" = "$EXPECT_HOST_COUNT" ] \
            || { echo "environment $ENVIRONMENT expects $EXPECT_HOST_COUNT host(s) but the repository secret lists $#" >&2; exit 1; }
          {
            echo "environment=$ENVIRONMENT"
            echo "instance_ids=$INSTANCE_IDS"
            echo "role_arn=$ROLE_ARN"
            echo "host_count=$EXPECT_HOST_COUNT"
            echo "expect_app_env=$EXPECT_APP_ENV"
            echo "expect_redis_key_prefix=$EXPECT_REDIS_KEY_PREFIX"
            echo "expect_swagger_enabled=$EXPECT_SWAGGER_ENABLED"
            echo "expect_app_geo_mode=$EXPECT_APP_GEO_MODE"
          } >> "$GITHUB_OUTPUT"
          # 저장소가 PUBLIC이고 Actions 로그도 공개다. instance 목록은 Secret이라 ***로 마스킹되지만
          # 마스킹에만 기대지 않고 여기서도 instance id를 로그에 싣지 않는다 — 개수만 남긴다.
          echo "deploying to $ENVIRONMENT ($EXPECT_HOST_COUNT host(s))"

      # pause gate: repo variable DEPLOY_PAUSED=true면 push 배포를 workflow 레벨에서 skip한다 —
      # SSM 전송 자체가 없으므로 실행 중 컨테이너와 host .env(APP_COMMIT_SHA)는 그대로다.
      # manual dispatch(deploy-existing)는 pause 중에도 실행된다.
      - name: Check deploy pause gate
        id: gate
        env:
          DEPLOY_PAUSED: ${{ vars.DEPLOY_PAUSED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DEPLOY_PAUSED" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy paused (repository variable DEPLOY_PAUSED=true) - skipping build and deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # deploy-existing input 형식 검증: SHA/digest가 canonical 형식이 아니면 AWS 접근 전에 실패한다.
      - name: Validate deploy-existing inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "image_sha must be a 40-char lowercase hex commit SHA" >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "image_digest must be sha256: followed by 64 lowercase hex chars" >&2; exit 1; }

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 환경별 role은 Resolve 단계가 고른다(#400) — 여기서 다시 판단하지 않는다.
          role-to-assume: ${{ steps.env.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.gate.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: steps.gate.outputs.deploy == 'true' && github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # deploy-existing ECR 선검증: tag가 없거나 build-only가 기록한 digest와 다르면
      # SSM 전송 전에 중단한다. 변경 가능한 tag가 다른 image를 가리키는 경우도 통과시키지 않는다.
      - name: Verify exact image in ECR (deploy-existing)
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          EXPECTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          ACTUAL_IMAGE_DIGEST=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_SHA" --region "$AWS_REGION" \
            --query 'images[0].imageId.imageDigest' --output text) \
            || { echo "image tag $IMAGE_SHA not found in ECR repository $ECR_REPOSITORY" >&2; exit 1; }
          [ "$ACTUAL_IMAGE_DIGEST" = "$EXPECTED_IMAGE_DIGEST" ] \
            || { echo "image digest does not match the build-only result" >&2; exit 1; }
          echo "exact ECR image verified for $IMAGE_SHA"

      - name: Deploy via SSM (docker run)
        if: steps.gate.outputs.deploy == 'true'
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # manual dispatch(deploy-existing)는 checkout SHA가 아니라 input의 기존 image SHA를 배포한다.
          IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_sha || github.sha }}
          IMAGE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.image_digest || '' }}
          # 환경 파생값은 전부 Resolve 단계의 출력만 읽는다(여기서 다시 판단하지 않는다).
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
          INSTANCE_IDS: ${{ steps.env.outputs.instance_ids }}
          HOST_COUNT: ${{ steps.env.outputs.host_count }}
          EXPECT_APP_ENV: ${{ steps.env.outputs.expect_app_env }}
          EXPECT_REDIS_KEY_PREFIX: ${{ steps.env.outputs.expect_redis_key_prefix }}
          EXPECT_SWAGGER_ENABLED: ${{ steps.env.outputs.expect_swagger_enabled }}
          EXPECT_APP_GEO_MODE: ${{ steps.env.outputs.expect_app_geo_mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            IMG="$REGISTRY/$ECR_REPOSITORY@$IMAGE_DIGEST"
          else
            IMG="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          # 원격 배포 스크립트: docker run 뒤 /api/v1/intro 헬스체크(최대 90s). 미기동 시 로그 덤프 후 실패.
          # \$ 로 이스케이프한 변수($ok,$i,$(seq))는 러너가 아니라 EC2 호스트에서 평가됨.
          # 이 heredoc 본문은 .github/scripts/test-deploy-contract.sh가 그대로 추출·실행해 검증한다.
          read -r -d '' SCRIPT <<EOF || true
          set -e
          # EXIT cleanup: 성공·실패 어느 종료 경로에서도 임시 .env 제거와 미사용 image 정리(prune -af)를
          # 수행한다. 진입 즉시 원래 exit status를 저장해 그대로 반환하므로 prune 실패가 배포 성공을
          # 실패로, 실패를 성공으로 바꾸지 않는다(고정 경고만 남김). 다른 container가 참조하는 image는
          # Docker가 보존하고, 미참조 tagged/dangling image만 삭제된다(rollback은 ECR 재pull).
          TMP_ENV=""
          cleanup() {
            STATUS=\$?
            trap - EXIT
            { [ -n "\$TMP_ENV" ] && rm -f "\$TMP_ENV"; } 2>/dev/null || true
            if ! docker image prune -af >/dev/null 2>&1; then
              echo "WARNING: docker image prune failed (deploy status unchanged)"
            fi
            exit \$STATUS
          }
          trap cleanup EXIT
          # 경로 상수(기본이 운영 경로). LAIMORY_* override는 test-deploy-contract.sh harness가 동일한
          # script 본문을 다른 host에서 실행하기 위한 seam이며 SSM 운영 실행에서는 설정되지 않는다.
          ENV_FILE="\${LAIMORY_ENV_FILE:-/home/ubuntu/app/.env}"
          CRED_FILE="\${LAIMORY_FCM_CRED_FILE:-/home/ubuntu/app/secrets/firebase-service-account.json}"
          # .env 검증 헬퍼(값 비출력): key가 정확히 한 줄 존재하고 기대 줄과 byte 일치해야 한다.
          # 실패 메시지는 key 이름·개수까지만 — 값은 SSM/Actions 로그에 출력하지 않는다(로그 장기 보존).
          require_exact_line() {
            REQ_KEY="\$1"; REQ_LINE="\$2"
            REQ_COUNT=\$(grep -c "^\$REQ_KEY=" "\$ENV_FILE" || true)
            [ "\$REQ_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env \$REQ_KEY must appear exactly once (found \$REQ_COUNT)"; exit 1; }
            grep -qxF "\$REQ_LINE" "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env \$REQ_KEY has unexpected value"; exit 1; }
          }
          # pre-flight 1 — secret presence: 앱이 fail-fast로 요구하는 .env 필수 키 검증 — 구 컨테이너를
          # 내리기 전에 실패시켜 "새 컨테이너 기동 불가 + 구 컨테이너 이미 중지" 다운타임을 막는다.
          # (JWT_SECRET은 HS256 최소 32자)
          grep -qE '^JWT_SECRET=.{32,}\$' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env JWT_SECRET missing or shorter than 32 chars"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_ID=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_ID missing"; exit 1; }
          grep -qE '^GOOGLE_CLIENT_SECRET=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env GOOGLE_CLIENT_SECRET missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_ID=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_ID missing"; exit 1; }
          grep -qE '^KAKAO_CLIENT_SECRET=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env KAKAO_CLIENT_SECRET missing"; exit 1; }
          # pre-flight 2 — runtime SSOT exact-one 검증: 장기 실행 컨테이너에 -e override가 없으므로 환경
          # 고정값·mode가 .env에 정확히 한 줄씩 없으면 앱이 application default(빈 Redis prefix·local·
          # noop·Swagger off)로 조용히 기동한다. 그 전에 fail-closed한다(중복 key의 --env-file 해석
          # 순서에도 의존하지 않는다).
          # 기대값은 러너의 Resolve 단계가 환경별로 넣는다 — 값이 리터럴에서 변수로 바뀌었을 뿐
          # "정확히 한 줄 + byte 일치"라는 성질은 그대로다. 기대값이 비면(오타·미설정) .env의 실제
          # 값과 어긋나 그대로 실패한다. 다만 prod의 REDIS_KEY_PREFIX는 빈 값이 정상이라,
          # 이 키만은 Resolve 단계의 환경 판정이 유일한 방어선이다.
          require_exact_line REDIS_KEY_PREFIX "REDIS_KEY_PREFIX=${EXPECT_REDIS_KEY_PREFIX}"
          require_exact_line APP_ENV "APP_ENV=${EXPECT_APP_ENV}"
          require_exact_line APP_GEO_MODE "APP_GEO_MODE=${EXPECT_APP_GEO_MODE}"
          require_exact_line SWAGGER_ENABLED "SWAGGER_ENABLED=${EXPECT_SWAGGER_ENABLED}"
          AI_COUNT=\$(grep -c '^APP_AI_MODE=' "\$ENV_FILE" || true)
          [ "\$AI_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_AI_MODE must appear exactly once (found \$AI_COUNT)"; exit 1; }
          grep -qxE 'APP_AI_MODE=(noop|fake|http|agentcore)' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_AI_MODE must be one of noop|fake|http|agentcore"; exit 1; }
          if grep -qxF 'APP_AI_MODE=http' "\$ENV_FILE"; then
            AI_URL_COUNT=\$(grep -c '^APP_AI_HTTP_BASE_URL=' "\$ENV_FILE" || true)
            [ "\$AI_URL_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_AI_HTTP_BASE_URL must appear exactly once when APP_AI_MODE=http (found \$AI_URL_COUNT)"; exit 1; }
            grep -qE '^APP_AI_HTTP_BASE_URL=.+' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_AI_HTTP_BASE_URL must be non-empty when APP_AI_MODE=http"; exit 1; }
          fi
          if grep -qxF 'APP_AI_MODE=agentcore' "\$ENV_FILE"; then
            # AgentCore mode(#338): 앱이 Bedrock AgentCore Runtime을 InvokeAgentRuntime으로 호출한다.
            # 대상 Runtime ARN과 endpoint(qualifier)가 .env에 정확히 한 줄씩 non-empty여야 하고, ARN은
            # full Runtime ARN이면서 배포 region이어야 한다(다른 리전 ARN이면 앱이 기동 실패 — 구 컨테이너를
            # 내린 뒤에 알게 되는 것을 막는다). 진단은 key 이름·개수까지만 낸다.
            # 자격증명은 runtime role(IMDS)만 쓰므로 아래 AWS override 금지 규칙이 그대로 적용된다.
            for AGENTCORE_KEY in APP_AI_AGENTCORE_RUNTIME_ARN APP_AI_AGENTCORE_ENDPOINT; do
              AGENTCORE_COUNT=\$(grep -c "^\$AGENTCORE_KEY=" "\$ENV_FILE" || true)
              [ "\$AGENTCORE_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env \$AGENTCORE_KEY must appear exactly once when APP_AI_MODE=agentcore (found \$AGENTCORE_COUNT)"; exit 1; }
              grep -qE "^\$AGENTCORE_KEY=.+" "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env \$AGENTCORE_KEY must be non-empty when APP_AI_MODE=agentcore"; exit 1; }
            done
            grep -qE '^APP_AI_AGENTCORE_RUNTIME_ARN=arn:aws[a-zA-Z-]*:bedrock-agentcore:${AWS_REGION}:[0-9]{12}:runtime/.+\$' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_AI_AGENTCORE_RUNTIME_ARN must be a full AgentCore Runtime ARN in ${AWS_REGION}"; exit 1; }
          fi
          # spring profile 가드: 배포 컨테이너는 기본 프로필로만 기동해야 한다 — .env에
          # SPRING_PROFILES_ACTIVE가 없는 것이 정상이고, 값에 docker가 끼면 dummy JWT 기본값·
          # localhost DB 등 배포에서 위험한 기본값과 subject fixture-key 기본값까지 켜진다
          # (@Profile 게이팅 없음 — 이 가드와 아래 subject mode 값 고정이 배포의 fixture 금지를
          # 담당한다). 값은 비밀이 아니지만 진단은 key 이름과 고정 문구만 낸다.
          if grep -qE '^SPRING_PROFILES_ACTIVE=.*docker' "\$ENV_FILE"; then
            echo "PREFLIGHT FAILED: .env SPRING_PROFILES_ACTIVE docker profile must not be active"; exit 1;
          fi
          # FCM push pre-flight: APP_PUSH_MODE가 credential mount 여부의 명시적 SSOT다. firebase면 ADC
          # 경로(GOOGLE_APPLICATION_CREDENTIALS, 고정 컨테이너 경로)도 .env가 정확히 한 줄로 소유해야 하고
          # host의 service account JSON이 있어야 배포를 진행한다(역시 구 컨테이너 중지 전 검사 — 앱은 ADC
          # 실패 시 fail-fast). noop이면 credential·mount 없이 기동한다. 파일은 승인된 SSM 절차로 수동
          # 배치한다. credential 원문은 Git/이미지/env 값에 두지 않고
          # read-only 파일 mount로만 전달한다.
          PUSH_COUNT=\$(grep -c '^APP_PUSH_MODE=' "\$ENV_FILE" || true)
          [ "\$PUSH_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env APP_PUSH_MODE must appear exactly once (found \$PUSH_COUNT)"; exit 1; }
          grep -qxE 'APP_PUSH_MODE=(noop|firebase)' "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env APP_PUSH_MODE must be one of noop|firebase"; exit 1; }
          PUSH_ARGS=""
          if grep -qxF 'APP_PUSH_MODE=firebase' "\$ENV_FILE"; then
            require_exact_line GOOGLE_APPLICATION_CREDENTIALS "GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json"
            { [ -f "\$CRED_FILE" ] && [ -s "\$CRED_FILE" ]; } || { echo "PREFLIGHT FAILED: APP_PUSH_MODE=firebase but \$CRED_FILE missing or empty"; exit 1; }
            PUSH_ARGS="-v \$CRED_FILE:/run/secrets/firebase-service-account.json:ro"
          fi
