          SUBJECT_SECRET_ARN=\$(grep '^APP_SUBJECT_SECRET_ARN=' "\$ENV_FILE" | cut -d= -f2-)
          SUBJECT_SECRET_PAYLOAD=\$( unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE AWS_DEFAULT_PROFILE AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_ROLE_SESSION_NAME AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_EC2_METADATA_DISABLED AWS_EC2_METADATA_SERVICE_ENDPOINT AWS_ENDPOINT_URL AWS_ENDPOINT_URL_SECRETS_MANAGER; AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_CONFIG_FILE=/dev/null aws secretsmanager get-secret-value --secret-id "\$SUBJECT_SECRET_ARN" --region ${AWS_REGION} --query SecretString --output json 2>/dev/null ) || { echo "PREFLIGHT FAILED: subject secret read failed (runtime role GetSecretValue or ARN)"; exit 1; }
          SUBJECT_SECRET_DIAG=\$(SUBJECT_SECRET_PAYLOAD="\$SUBJECT_SECRET_PAYLOAD" python3 -c '
          import base64, json, os, sys
          def die(msg):
              print(msg)
              sys.exit(1)
          payload = json.loads(os.environ["SUBJECT_SECRET_PAYLOAD"])
          if payload is None:
              die("SecretString missing (SecretBinary-only secret is not supported)")
          try:
              root = json.loads(payload)
          except Exception:
              die("is not valid JSON")
          if not isinstance(root, dict):
              die("must be a JSON object")
          def ver(field):
              value = root.get(field)
              if isinstance(value, bool) or not isinstance(value, int):
                  die(field + " must be an integer")
              if value <= 0 or value > 32767:
                  die(field + " must be a positive SMALLINT")
              return value
          def key(field):
              value = root.get(field)
              if not isinstance(value, str):
                  die(field + " must be a string")
              try:
                  decoded = base64.b64decode(value, validate=True)
              except Exception:
                  die(field + " must be valid base64")
              if len(decoded) != 32:
                  die(field + " must decode to exactly 32 bytes")
              return decoded
          current_version = ver("currentVersion")
          current_key = key("currentKey")
          if (root.get("previousVersion") is None) != (root.get("previousKey") is None):
              die("previousVersion and previousKey must be present together")
          if root.get("previousVersion") is not None:
              if ver("previousVersion") == current_version:
                  die("previousVersion must differ from currentVersion")
              if key("previousKey") == current_key:
                  die("currentKey and previousKey must differ")
          ' 2>/dev/null) || { echo "PREFLIGHT FAILED: subject secret \${SUBJECT_SECRET_DIAG:-validation could not run}"; exit 1; }
          SUBJECT_SECRET_PAYLOAD=""
          # mapping schema: 앱 datasource와 같은 DB_HOST:3306/laimory를 검사한다. 앱이 소비하는 DB_* 3개를
          # exact-one non-empty로 먼저 확인한 뒤(값 비출력), 고정 태그 mysql:8.0 client로 column 수·정확한
          # type/nullability·단일-column PK/UNIQUE를 모두 판정한다. 추가 raw user_id나 composite index도
          # 실패한다. password는 docker 인자에 값을 싣지 않도록 -e MYSQL_PWD 환경 전달만 쓴다.
          for DB_KEY in DB_HOST DB_USERNAME DB_PASSWORD; do
            DB_KEY_COUNT=\$(grep -c "^\$DB_KEY=" "\$ENV_FILE" || true)
            [ "\$DB_KEY_COUNT" = "1" ] || { echo "PREFLIGHT FAILED: .env \$DB_KEY must appear exactly once (found \$DB_KEY_COUNT)"; exit 1; }
            grep -qE "^\$DB_KEY=.+" "\$ENV_FILE" || { echo "PREFLIGHT FAILED: .env \$DB_KEY must be non-empty"; exit 1; }
          done
          DB_HOST_VAL=\$(grep '^DB_HOST=' "\$ENV_FILE" | cut -d= -f2-)
          DB_USER_VAL=\$(grep '^DB_USERNAME=' "\$ENV_FILE" | cut -d= -f2-)
          DB_PASS_VAL=\$(grep '^DB_PASSWORD=' "\$ENV_FILE" | cut -d= -f2-)
          SUBJECT_SCHEMA_SQL="SELECT CASE WHEN (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links') = 3 AND (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND ((COLUMN_NAME = 'user_lookup_key' AND COLUMN_TYPE = 'binary(32)' AND IS_NULLABLE = 'NO') OR (COLUMN_NAME = 'subject_id' AND COLUMN_TYPE = 'varchar(36)' AND CHARACTER_SET_NAME = 'ascii' AND COLLATION_NAME = 'ascii_bin' AND IS_NULLABLE = 'NO') OR (COLUMN_NAME = 'lookup_key_version' AND COLUMN_TYPE = 'smallint' AND IS_NULLABLE = 'NO'))) = 3 AND (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND INDEX_NAME = 'PRIMARY') = 1 AND (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND INDEX_NAME = 'PRIMARY' AND NON_UNIQUE = 0 AND COLUMN_NAME = 'user_lookup_key' AND SEQ_IN_INDEX = 1 AND SUB_PART IS NULL) = 1 AND EXISTS (SELECT 1 FROM (SELECT INDEX_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'user_subject_links' AND NON_UNIQUE = 0 AND INDEX_NAME <> 'PRIMARY' GROUP BY INDEX_NAME HAVING COUNT(*) = 1 AND MAX(COLUMN_NAME = 'subject_id' AND SEQ_IN_INDEX = 1 AND SUB_PART IS NULL) = 1) subject_unique) THEN 1 ELSE 0 END"
          SCHEMA_MATCH=\$(MYSQL_PWD="\$DB_PASS_VAL" docker run --rm --network host -e MYSQL_PWD mysql:8.0 mysql -h"\$DB_HOST_VAL" -P3306 -u"\$DB_USER_VAL" -N -B -e "\$SUBJECT_SCHEMA_SQL" laimory 2>/dev/null) || { echo "PREFLIGHT FAILED: subject mapping schema query failed"; exit 1; }
          [ "\$SCHEMA_MATCH" = "1" ] || { echo "PREFLIGHT FAILED: user_subject_links schema mismatch"; exit 1; }
